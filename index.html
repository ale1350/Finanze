<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanze</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanze">
<meta name="theme-color" content="#091D29">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: una colonna minimal (max 560px). Mese: anello pagamenti + vincolo + spese varie,
   lista pagamenti a righe, barra "Da spostare" fissa sopra la tab bar.
   Tema unico blu ottanio scuro: bianco per il testo, verde scuro = fatto, rosso scuro = problema. */
:root {
  color-scheme: dark;
  --bg: #091D29;
  --surface: #0F2735;
  --surface-2: #153243;
  --ink: #F1F6F8;
  --muted: #8BA3B1;
  --dim: #637D8B;
  --line: #193546;
  --line-strong: #34576B;
  --track: #193546;
  --ok: #2F8A57;
  --ok-ink: #FFFFFF;
  --bad: #D04A3B;
  --f-display: "Archivo", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; margin: 0; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-stretch: 110%; }
.bad { color: var(--bad) !important; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 6px; padding-block: 10px 8px; }
.top h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
.top h1 small { display: block; font-family: var(--f-body); font-stretch: 100%; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.mhead h1 { text-align: center; display: grid; gap: 1px; justify-items: center; }
.mtitle { font-size: 21px; text-transform: capitalize; }
.mtag { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.mtag.link { border: 0; background: none; padding: 2px 4px; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.navbtn { width: 44px; height: 44px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; flex: none; padding: 0; }
.navbtn svg { width: 22px; height: 22px; stroke-width: 2.8; }
.navbtn:disabled { opacity: .25; cursor: default; }

main { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
main .wrap { display: grid; gap: 22px; padding-block: 8px 12px; }

/* riepilogo con anello */
.summary { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 116px; height: 116px; }
.ring svg { display: block; }
.ring-arc { transition: stroke-dashoffset .7s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
.ring-in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-in .num { font-size: 27px; font-weight: 800; line-height: 1; }
.ring-in small { font-size: 11px; font-weight: 600; color: var(--muted); }
.kpis { flex: 1; min-width: 0; display: grid; gap: 16px; margin: 0; }
.kpis > div { display: grid; gap: 1px; }
.kpis dt { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpis dd { margin: 0; }
.kpis dd.num { font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
.kpis .kpi-sub { font-size: 12px; color: var(--dim); }
.sv { display: flex; flex-wrap: nowrap; align-items: flex-end; gap: 10px; min-width: 0; }
.sv > .num { font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.amex { border: 0; border-left: 2px solid var(--line-strong); background: none; padding: 0 0 2px 10px; color: #BDD1DB; display: grid; justify-items: start; gap: 0; white-space: nowrap; flex: none; }
.amex small { font-size: 9.5px; font-weight: 800; letter-spacing: .1em; color: var(--dim); line-height: 1.2; }
.amex .num { font-size: 17px; font-weight: 800; line-height: 1.15; }
.amex.manual .num { text-decoration: underline; text-decoration-style: dotted; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.ced { border: 0; background: none; padding: 0; text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); }
.ced u { color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.nudge { border: 2px solid var(--line-strong); background: none; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; }
.nudge span { flex: 1; display: grid; gap: 2px; min-width: 0; }
.nudge small { color: var(--muted); font-size: 13px; }
.chev { width: 18px; height: 18px; color: var(--muted); flex: none; }

/* pagamenti */
.pays header, .card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 8px; }
.pays h2, .card h2 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 16px; font-weight: 800; }
.count { font-size: 13px; font-weight: 600; color: var(--muted); text-align: right; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1.5px solid var(--line); min-height: 54px; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--line-strong); background: transparent; flex: none; display: grid; place-items: center; padding: 0; transition: background .2s, border-color .2s, transform .15s; }
.check svg { width: 16px; height: 16px; stroke: var(--ok-ink); stroke-width: 3.6; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.check:active { transform: scale(.88); }
.row.paid .check { background: var(--ok); border-color: var(--ok); }
.row.paid .check svg { opacity: 1; transform: none; }
.name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.amt { border: 0; background: none; padding: 8px 0 8px 8px; font-weight: 700; font-size: 15.5px; white-space: nowrap; }
.row.paid .name, .row.paid .amt { color: var(--dim); }
.row.zero { opacity: .45; }
.row.est .amt { font-style: italic; color: var(--muted); }
.row.late .tag, .row.late .amt { color: var(--bad); }

/* barra trasferimento */
.tbar { position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 24; background: var(--bg); }
.transfer { border-top: 2.5px solid var(--ink); padding: 12px 0; display: flex; align-items: center; gap: 12px; transition: border-color .25s; }
.t-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.t-lab { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.t-num { font-size: 32px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; transition: color .25s; }
.t-check { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--ink); background: transparent; color: var(--ink); display: grid; place-items: center; padding: 0; flex: none; transition: background .2s, border-color .2s, transform .15s; }
.t-check svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 3; }
.t-check:active { transform: scale(.92); }
.transfer.done { border-top-color: var(--ok); }
.transfer.done .t-num { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 3px; }
.transfer.done .t-check { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.transfer.partial .t-check { border-style: dashed; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1.5px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { border: 0; background: none; padding: 10px 0 8px; display: grid; justify-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--dim); }
.tab svg { width: 23px; height: 23px; stroke-width: 2.4; }
.tab[aria-current="page"] { color: var(--ink); }

/* sezioni (andamento, impostazioni) */
.card { display: grid; gap: 12px; min-width: 0; padding-top: 16px; border-top: 2.5px solid var(--ink); }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.sub b { color: var(--ink); }
.note { font-size: 12.5px; color: var(--dim); margin: 0; }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 8px; white-space: nowrap; border: 1.5px solid var(--line-strong); color: var(--muted); }
.pill-ok { border-color: var(--ok); color: #7FC9A0; }
.pill-bad { border-color: var(--bad); color: var(--bad); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .num { font-size: 24px; font-weight: 800; }
.stat small { color: var(--dim); font-size: 12px; }
.fc { display: grid; }
.fc-month { border: 0; border-top: 1.5px solid var(--line); background: none; padding: 12px 0; text-align: left; display: grid; gap: 8px; width: 100%; }
.fc-month:first-child { border-top: 0; padding-top: 0; }
.fc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; text-transform: capitalize; }
.fc-head .pill { text-transform: none; }
.fc-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fc-row > span { display: grid; gap: 1px; min-width: 0; }
.fc-row small { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fc-row b { font-family: var(--f-display); font-stretch: 110%; font-size: 18px; font-weight: 800; }
.heavy { display: grid; }
.heavy button { border: 0; border-top: 1.5px solid var(--line); background: none; padding: 12px 0; text-align: left; display: grid; gap: 3px; }
.heavy button:first-child { border-top: 0; padding-top: 0; }
.heavy .h1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; text-transform: capitalize; }
.heavy small { color: var(--muted); font-size: 12.5px; }

/* impostazioni */
.field { display: grid; gap: 6px; }
.field label, .lab { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.input, select.input, textarea.input { width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-width: 0; }
.input:focus { border-color: var(--ink); outline: none; }
.input-big { font-family: var(--f-display); font-size: 30px; font-weight: 800; font-stretch: 110%; padding: 12px 16px; }
textarea.input { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 110px; resize: vertical; }
.months { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.months .input { padding: 10px 8px; font-size: 15px; text-align: right; }
@media (max-width: 360px) { .months { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-top: 1.5px solid var(--line); width: 100%; background: none; text-align: left; }
.list li:first-child .setrow { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.setrow .name { white-space: normal; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ok); }
.btn { border: 2px solid var(--line-strong); border-radius: 12px; padding: 12px 16px; font-weight: 700; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-danger { border-color: var(--bad); color: var(--bad); }
.btn-small { padding: 6px 12px; font-size: 13px; border-radius: 99px; }
.btn-block { width: 100%; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(2, 12, 18, .72); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .9, .2, 1); }
.sheet.on { transform: none; }
.sheet .panel { max-width: 560px; margin: 0 auto; background: var(--surface); border-top: 2.5px solid var(--ink); border-radius: 22px 22px 0 0; padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 88vh; overflow-y: auto; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line-strong); margin: 0 auto 2px; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 20px; font-weight: 800; text-wrap: balance; }
.sheet .actions { display: flex; gap: 10px; }
.sheet .actions .btn { flex: 1; }
.err { color: var(--bad); font-size: 13px; margin: 0; }

.toast { display: flex; align-items: center; gap: 14px; position: fixed; left: 50%; bottom: calc(200px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* benvenuto */
.welcome { display: grid; gap: 18px; padding-block: 28px 40px; }
.welcome .mark { width: 72px; height: 72px; }
.welcome h2 { margin: 0; font-family: var(--f-display); font-stretch: 115%; font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 46ch; }
.choices { display: grid; gap: 10px; }
.choice { border: 2px solid var(--line); background: none; border-radius: 16px; padding: 14px 16px; text-align: left; display: grid; gap: 3px; }
.choice b { font-size: 16px; }
.choice span { color: var(--muted); font-size: 13.5px; }
.choice.primary { border-color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* iPhone stretti (≤ 380px): anello e cifre un filo più piccoli, così AMEX resta accanto alle spese varie */
@media (max-width: 380px) {
  .summary { gap: 16px; }
  .ring, .ring svg { width: 104px; height: 104px; }
  .ring-in .num { font-size: 24px; }
  .kpis dd.num, .sv > .num { font-size: 25px; }
  .sv { gap: 8px; }
  .amex { padding-left: 8px; }
  .amex .num { font-size: 16px; }
}

/* v1.7 — dettagli e animazioni */
.cedrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -6px; }
.eye { width: 40px; height: 40px; border: 2px solid var(--line); border-radius: 50%; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; flex: none; }
.eye svg { width: 19px; height: 19px; }
.eye[aria-pressed="true"] { color: var(--ink); border-color: var(--line-strong); }
html.privacy .num:not(.ring-in .num), html.privacy .amt, html.privacy .kpi-sub, html.privacy .pays .count { filter: blur(9px); transition: filter .25s; }
html.privacy .t-copy { pointer-events: none; }

.t-copy { border: 0; background: none; padding: 0; color: inherit; display: inline-flex; align-items: center; gap: 8px; text-align: left; }
.t-copy svg { width: 18px; height: 18px; color: var(--dim); flex: none; }
.t-copy:active .t-num { opacity: .6; }

.fold { width: 100%; border: 0; border-top: 1.5px solid var(--line); background: none; padding: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 700; }
.fold svg { width: 18px; height: 18px; transition: transform .25s; }
.fold[aria-expanded="true"] svg { transform: rotate(180deg); }
.list-done { animation: fadein .3s ease; }
.alldone { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1.5px solid var(--line); font-weight: 700; color: #8FD3AC; }
.alldone-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; flex: none; }
.alldone-dot svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.6; }

.row.going { animation: going .26s ease forwards; }
.row.coming { animation: coming .26s ease forwards; }
@keyframes going { to { opacity: 0; transform: translateX(24px); } }
@keyframes coming { to { opacity: 0; transform: translateY(-8px); } }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.slide-l { animation: slidel .32s cubic-bezier(.2, .8, .2, 1); }
.slide-r { animation: slider .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes slidel { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slider { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

.ring.full svg { filter: drop-shadow(0 0 10px rgba(47, 138, 87, .45)); }
.ring.celebrate { animation: pop .7s cubic-bezier(.3, 1.5, .5, 1); }
.ring.celebrate::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--ok); animation: ripple .9s ease-out forwards; pointer-events: none; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes ripple { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }

.toast.has-action { pointer-events: auto; }
.toast-btn { border: 0; background: none; color: var(--ok); font-weight: 800; padding: 4px 2px; text-transform: uppercase; font-size: 12.5px; letter-spacing: .06em; filter: brightness(.85); }

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div class="tbar" id="bar" hidden></div>
<nav class="tabs" id="tabs" hidden aria-label="Sezioni"></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Modifica"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.FIN_PWA = true; window.FIN_SEED = null; window.FIN_XLSX_SRC = 'xlsx.mini.min.js';</script>
<script>
/* Finanze — logica pura (mesi, calcoli, import dal file Excel). Funziona sia nel browser sia in Node. */
(function (root) {
  'use strict';
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function keyOf(y, m) { return y + '-' + pad(m); }
  function parseKey(k) { var p = String(k).split('-'); return { y: +p[0], m: +p[1] }; }
  function addM(k, n) { var p = parseKey(k); var t = p.y * 12 + (p.m - 1) + n; return keyOf(Math.floor(t / 12), (t % 12) + 1); }
  function nowKey(d) { d = d || new Date(); return keyOf(d.getFullYear(), d.getMonth() + 1); }
  function r2(v) { return Math.round((+v || 0) * 100) / 100; }
  var MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  function label(k) { var p = parseKey(k); return MESI[p.m - 1] + ' ' + p.y; }
  function shortLabel(k) { var p = parseKey(k); return MESI[p.m - 1].slice(0, 3) + ' ' + String(p.y).slice(2); }

  function emptyMese() { return { reddito: null, importi: {}, pagati: {}, mov: [] }; }

      var a = C.amt(db, k, v), paid = !!(m.pagati && m.pagati[v.id]);
      var cls = ['row'], tag = '';
      if (paid) cls.push('paid');
      else if (a <= 0) { cls.push('zero'); tag = '<span class="tag">· nessuna</span>'; }
      else if (past) { cls.push('late'); tag = '<span class="tag">· da spuntare</span>'; }
      else if (v.stima) { cls.push('est'); tag = '<span class="tag">· stima</span>'; }
      return '<li class="' + cls.join(' ') + '" data-row="' + esc(v.id) + '">' +
        '<button class="check" data-act="toggle" data-id="' + esc(v.id) + '" aria-pressed="' + paid + '" aria-label="' + (paid ? 'Segna come non pagato: ' : 'Segna come pagato: ') + esc(v.nome) + '">' + ICON.check + '</button>' +
        '<span class="name">' + esc(v.nome) + tag + '</span>' +
        '<button class="amt num" data-act="amt" data-id="' + esc(v.id) + '" aria-label="Modifica importo ' + esc(v.nome) + '">' + eur(a) + '</button></li>';
    };
    var todo = [], done = [];
    db.voci.forEach(function (v) {
      var a = C.amt(db, k, v), paid = !!(m.pagati && m.pagati[v.id]);
      (paid || a <= 0 ? done : todo).push(v);
    });
    h += '<section class="pays"><header><h2>Pagamenti</h2><span class="count">' + c.nPag + ' di ' + c.nVoci + (c.daPagare > 0.005 ? ' · mancano ' + eurS(c.daPagare) : (c.tot > 0 ? ' · tutto pagato' : '')) + '</span></header><ul class="list">';
    if (!todo.length) h += '<li class="alldone"><span class="alldone-dot">' + ICON.check + '</span>Tutto pagato per <span style="text-transform:capitalize">&nbsp;' + esc(C.MESI[C.parseKey(k).m - 1]) + '</span></li>';
    todo.forEach(function (v) { h += rowHTML(v); });
    h += '</ul>';
    if (done.length) {
      h += '<button class="fold" data-act="fold" aria-expanded="' + ui.showPaid + '"><span>Pagati e a zero · ' + done.length + '</span>' + ICON.down + '</button>';
      if (ui.showPaid) { h += '<ul class="list list-done">'; done.forEach(function (v) { h += rowHTML(v); }); h += '</ul>'; }
    }
    h += '</section>';

    // Barra trasferimento (fissa in basso)
    var sp = m.spostato || null, spAmt = sp ? (+sp.importo || 0) : 0, manca = sp ? C.r2(c.spostare - spAmt) : 0;
    var spDone = !!sp && Math.abs(manca) < 0.5;
    var lab = 'Da spostare';
    if (sp && spDone) lab += ' · fatto il ' + dayLabel(sp.data);
    else if (sp) lab += ' · spostati ' + eurS(spAmt) + ' il ' + dayLabel(sp.data) + ' · ' + (manca > 0 ? 'mancano ' + eurS(manca) : eurS(-manca) + ' in più');
    $bar.innerHTML = '<div class="wrap"><div class="transfer' + (spDone ? ' done' : '') + (sp && !spDone ? ' partial' : '') + '">' +
      '<div class="t-main"><span class="t-lab">' + esc(lab) + '</span><button class="t-copy" data-act="copy" data-v="' + c.spostare + '" aria-label="Copia l\'importo da spostare"><span class="t-num num' + (c.spostare < 0 ? ' bad' : '') + '" data-count="sp" data-val="' + c.spostare + '" data-fmt="f">' + eur(c.spostare) + '</span>' + ICON.copy + '</button></div>' +
      '<button class="t-check" data-act="spostato" aria-pressed="' + spDone + '" aria-label="' + (spDone ? 'Spostato. Tocca per annullare' : (sp ? 'Aggiorna: segna l\'importo attuale come spostato' : 'Segna come spostato')) + '">' + ICON.check + '</button>' +
      '</div></div>';
    return h;
  }

  function rangeKeys() {
    var ks = keys(), cur = C.nowKey();
    var start = db.settings.inizio || (ks[0] || cur);
    if (ks.length && ks[0] < start) start = ks[0];
    var end = lastKey(); var e2 = C.addM(cur, 2); if (e2 > end) end = e2;
    var out = [], k = start, guard = 0;
    while (k <= end && guard++ < 60) { out.push(k); k = C.addM(k, 1); }
    return out;
  }

  function viewAnno() {
    var ks = rangeKeys(), cur = C.nowKey(), h = '';
    // Prossimi 3 mesi
    var next = [1, 2, 3].map(function (n) { return C.addM(cur, n); });
    var tot = { fisse: 0, vin: 0, varie: 0 };
    h += '<section class="card"><header><h2>Prossimi 3 mesi</h2></header><div class="fc">';
    next.forEach(function (k) {
      var c = C.calc(db, k);
      tot.fisse += c.fisse; tot.vin += c.vincolo; tot.varie += c.varie;
      h += '<button class="fc-month" data-act="gomonth" data-k="' + k + '"><span class="fc-head"><span>' + esc(C.label(k)) + '</span>' + (c.stima ? '<span class="pill pill-warn">cedolino stimato</span>' : '<span class="pill pill-ok">cedolino inserito</span>') + '</span>' +
        '<span class="fc-row">' +
        '<span><small>Spese fisse</small><b class="num">' + eur0(c.fisse) + '</b></span>' +
        '<span><small>Vincolo</small><b class="num">' + eur0(c.vincolo) + '</b></span>' +
        '<span><small>Spese varie</small><b class="num"' + (c.varie < 0 ? ' style="color:var(--bad)"' : '') + '>' + eur0(c.varie) + '</b></span>' +
        '</span></button>';
    });
    h += '</div><p class="sub">In tutto: spese fisse <b class="num">' + eur0(tot.fisse) + '</b> · vincolo <b class="num">' + eur0(tot.vin) + '</b> · spese varie <b class="num">' + eur0(tot.varie) + '</b></p>' +
      '<p class="note">Spese fisse con gli importi previsti (bollette stimate). Tocca un mese per aprirlo.</p></section>';

    // media spese fisse
    var sumF = 0, sumV = 0;
    ks.forEach(function (k) { var c = C.calc(db, k); sumF += c.fisse; sumV += c.vincolo; });
    var nk = Math.max(ks.length, 1);
    h += '<section class="card"><header><h2>Spese fisse mensili</h2></header><div class="stats">' +
      stat('Media spese fisse', sumF / nk, 'escluso investimento') +
      stat('Media vincolo', sumV / nk, 'arrotondato a 10 €') +
      '</div><p class="note">Calcolata su ' + nk + ' mesi (' + C.shortLabel(ks[0]) + ' → ' + C.shortLabel(ks[ks.length - 1]) + '). Si aggiorna da sola quando cambi un importo.</p></section>';

    // heavy months
    var avg = ks.reduce(function (s, k) { return s + C.calc(db, k).vincolo; }, 0) / Math.max(ks.length, 1);
    var heavy = ks.filter(function (k) { return k > cur; }).map(function (k) { return { k: k, c: C.calc(db, k) }; })
      .filter(function (x) { return x.c.vincolo > avg * 1.08; }).sort(function (a, b) { return b.c.vincolo - a.c.vincolo; }).slice(0, 3)
      .sort(function (a, b) { return a.k < b.k ? -1 : 1; });
    if (heavy.length) {
      h += '<section class="card"><header><h2>Mesi pesanti in arrivo</h2></header><p class="sub">Il vincolo medio è ' + eur0(avg) + '. Questi mesi lo superano:</p><div class="heavy">';
      heavy.forEach(function (x) {
        var extra = db.voci.filter(function (v) { var a = C.amt(db, x.k, v), d = +v.importo || 0; return v.gruppo !== 'investimento' && a > d + 1 && (!v.stima || a > d * 1.5); })
          .map(function (v) { return esc(v.nome) + ' ' + eur0(C.amt(db, x.k, v)); });
        h += '<button data-act="gomonth" data-k="' + x.k + '"><span class="h1"><span>' + esc(C.label(x.k)) + '</span><span class="num">' + eur0(x.c.vincolo) + '</span></span>' +
          '<small>' + (extra.length ? extra.join(' · ') : 'spese sopra la media') + ' · restano <span' + (x.c.varie < 0 ? ' class="bad"' : '') + '>' + eur0(x.c.varie) + '</span> di spese varie</small></button>';
      });
      h += '</div></section>';
    }

    // ETF
    var endK = ks[ks.length - 1], nowInv = C.investito(db, cur, true), endInv = C.investito(db, endK, false);
    var invVoce = db.voci.filter(function (v) { return v.gruppo === 'investimento'; })[0];
    h += '<section class="card"><header><h2>Investito in ETF</h2></header><div class="stats">' +
      stat('Ad oggi', nowInv, 'investimenti spuntati inclusi') +
      stat('A ' + C.shortLabel(endK), endInv, invVoce ? 'se continui con ' + eur0(C.amt(db, endK, invVoce)) + ' al mese' : 'secondo il piano') +
      '</div></section>';
    return h;
  }
  function stat(l, v, s) { return '<div class="stat"><span class="eyebrow">' + esc(l) + '</span><span class="num">' + eur0(v) + '</span><small>' + esc(s) + '</small></div>'; }

  /* ---------------- sheets ---------------- */
  var $scrim = document.getElementById('scrim'), $sheet = document.getElementById('sheet');
  var sheetSubmit = null, closeT = null;
  function openSheet(html, onSubmit, focusId) {
    clearTimeout(closeT);
    sheetSubmit = onSubmit;
    $sheet.innerHTML = '<form class="panel" id="sheet-form" novalidate><div class="grab"></div>' + html + '</form>';
    $scrim.hidden = false; $sheet.hidden = false;
    requestAnimationFrame(function () { $scrim.classList.add('on'); $sheet.classList.add('on'); });
    if (focusId) setTimeout(function () { var el = document.getElementById(focusId); if (el) { el.focus(); if (el.select) el.select(); } }, 260);
  }
  function closeSheet() {
    $scrim.classList.remove('on'); $sheet.classList.remove('on');
    clearTimeout(closeT);
    closeT = setTimeout(function () { $scrim.hidden = true; $sheet.hidden = true; $sheet.innerHTML = ''; }, 260);
    sheetSubmit = null;
  }
  function showErr(msg) { var e = document.getElementById('sheet-err'); if (e) { e.textContent = msg; e.hidden = false; } }
  var ERR = '<p class="err" id="sheet-err" hidden></p>';
  var ACTIONS = function (ok, extra) { return '<div class="actions"><button type="button" class="btn" data-act="close">Annulla</button><button type="submit" class="btn btn-primary">' + (ok || 'Salva') + '</button></div>' + (extra || ''); };

  function sheetAmt(id) {
    var v = voce(id), k = ui.month, a = C.amt(db, k, v);
    openSheet('<h3>' + esc(v.nome) + ' · <span style="text-transform:capitalize">' + esc(C.label(k)) + '</span></h3>' +
      (v.stima ? '<p class="note">L\'importo è una stima: sostituiscilo con quello della bolletta quando arriva.</p>' : '') +
      '<div class="field"><label for="s-amt">Importo</label><input class="input input-big" id="s-amt" inputmode="decimal" value="' + numStr(a) + '" autocomplete="off"></div>' +
      '<label class="toggle"><input type="checkbox" id="s-fwd"> Applica anche ai mesi successivi</label>' + ERR + ACTIONS(),
      function () {
        var n = parseNum(document.getElementById('s-amt').value);
        if (!isFinite(n) || n < 0) return showErr('Scrivi un importo valido, per esempio 99,36.');
        n = C.r2(n);
        ensure(k).importi[v.id] = n;
        if (document.getElementById('s-fwd').checked) {
          var end = lastKey(), x = C.addM(k, 1);
          while (x <= end) { ensure(x).importi[v.id] = n; x = C.addM(x, 1); }
          v.importo = n;
        }
        save(); closeSheet(); render(); toast('Importo aggiornato');
      }, 's-amt');
  }

  function sheetReddito() {
    var k = ui.month, m = C.getM(db, k), has = C.hasVal(m.reddito), prev = C.label(C.addM(k, -1)), nome = C.MESI[C.parseKey(C.addM(k, -1)).m - 1];
    openSheet('<h3>Cedolino di <span style="text-transform:capitalize">' + esc(prev) + '</span></h3>' +
      '<p class="note">È lo stipendio che finanzia le spese di ' + esc(C.label(k)) + '. ' + (has ? 'Netto già inserito.' : 'Per ora il calcolo usa la stima di ' + eur(C.stimaCedolino(db, k)) + '.') + '</p>' +
      '<div class="field"><label for="s-red">Netto in busta paga di ' + esc(nome) + '</label><input class="input input-big" id="s-red" inputmode="decimal" value="' + (has ? numStr(m.reddito) : '') + '" placeholder="' + numStr(C.stimaCedolino(db, k)) + '" autocomplete="off"></div>' +
      ERR + ACTIONS('Salva', has ? '<button type="button" class="btn btn-block" data-act="clearred">Torna alla stima</button>' : ''),
      function () {
        var n = parseNum(document.getElementById('s-red').value);

        if (!Array.isArray(db.settings.stimeCedolino)) db.settings.stimeCedolino = [null, null, null, null, null, null, null, null, null, null, null, null];
        db.settings.stimeCedolino[pi] = C.r2(n);
        save(); closeSheet(); render(); toast('Cedolino salvato · stima di ' + nome + ' aggiornata');
      }, 's-red');
  }

  function sheetAmex() {
    var k = ui.month, ax = C.amexDisponibile(db, k), nxl = C.label(C.addM(k, 1));
    openSheet('<h3>AMEX · <span style="text-transform:capitalize">' + esc(C.label(k)) + '</span></h3>' +
      '<p class="note">Quanto puoi spendere con la carta questo mese: lo paghi a ' + esc(nxl) + '. È pari alle spese varie di ' + esc(nxl) + ' (' + eur(ax.base) + ')' + (ax.base < 0 ? ', che sono negative: quindi 0' : '') + '.</p>' +
      '<div class="field"><label for="s-amex">Spendibile con AMEX</label><input class="input input-big" id="s-amex" inputmode="decimal" value="' + numStr(ax.val) + '" autocomplete="off"></div>' +
      (ax.manuale ? '<p class="note">Valore inserito a mano. Calcolo automatico: ' + eur(ax.auto) + '.</p>' : '') +
      ERR + ACTIONS('Salva', ax.manuale ? '<button type="button" class="btn btn-block" data-act="amexauto">Torna al calcolo automatico</button>' : ''),
      function () {
        var n = parseNum(document.getElementById('s-amex').value);

  }

  }

  function shareFile() {
    var json = JSON.stringify(db, null, 1);
    var name = 'finanze-backup-' + todayISO() + '.json';
    var file;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function (e) { if (e && e.name !== 'AbortError') toast('Usa «Copia codice»'); });
      return;
    }
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      toast('Se il file non compare, usa «Copia codice»');
    } catch (e) { toast('Usa «Copia codice»'); }
  }
  function copyCode() {
    var ta = document.getElementById('s-code');
    var done = function () { toast('Codice copiato'); };
    var fallback = function () { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); try { document.execCommand('copy'); done(); } catch (e) { toast('Seleziona il testo e copialo'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback); else fallback();
  }

  function decodeBackup(txt) {
    txt = String(txt || '').trim();
    var d;
    if (txt.charAt(0) === '{') d = JSON.parse(txt);
    else d = JSON.parse(decodeURIComponent(escape(atob(txt.replace(/\s/g, '')))));
    if (!C.valid(d)) throw new Error('Il codice non contiene un backup di Finanze.');
    return d;
  }
  function replaceData(d, msg) {
    var go = function () { db = d; save(); ui.month = focusMonth(); ui.tab = 'mese'; closeSheet(); render(); toast(msg); };
    if (db) sheetConfirm('Sostituire i dati attuali?', 'I dati presenti su questo dispositivo verranno sostituiti con quelli importati.', 'Sostituisci', go);
    else go();
  }
  function sheetPaste() {
    openSheet('<h3>Incolla codice di backup</h3><div class="field"><label for="s-paste">Codice</label><textarea class="input" id="s-paste" placeholder="Incolla qui il codice"></textarea></div>' + ERR + ACTIONS('Importa'),
      function () {
        try { var d = decodeBackup(document.getElementById('s-paste').value); } catch (e) { return showErr('Codice non valido. Copialo di nuovo per intero.'); }
        closeSheet(); setTimeout(function () { replaceData(d, 'Backup importato'); }, 280);
      }, 's-paste');
  }

  var xlsxLoading = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xlsxLoading) return xlsxLoading;
    xlsxLoading = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = window.FIN_XLSX_SRC;
      s.onload = function () { window.XLSX ? res(window.XLSX) : rej(new Error('x')); };
      s.onerror = function () { xlsxLoading = null; rej(new Error('Non riesco a caricare il lettore Excel. Controlla la connessione e riprova.')); };
      document.head.appendChild(s);
    });
    return xlsxLoading;
  }
  function importFile(file) {
    if (!file) return;
    var isJson = /\.json$/i.test(file.name) || file.type === 'application/json';
    var r = new FileReader();
    r.onerror = function () { toast('Non riesco a leggere il file'); };
    if (isJson) {
      r.onload = function () { try { replaceData(decodeBackup(r.result), 'Backup importato'); } catch (e) { toast('Il file non è un backup di Finanze'); } };
      r.readAsText(file);
    } else {
      toast('Leggo il file…');
      r.onload = function () {
        loadXLSX().then(function (X) {
          var wb = X.read(new Uint8Array(r.result), { type: 'array' });
          var d = C.parseWorkbook(X, wb);
          replaceData(d, 'Importate ' + d.voci.length + ' voci e ' + Object.keys(d.mesi).length + ' mesi');
        }).catch(function (e) { toast(e && e.message ? e.message : 'Il file Excel non è nel formato atteso'); });
      };
      r.readAsArrayBuffer(file);
    }
  }

  function blankDb() {
    var vs = [['Mutuo', 'Credit Agricole', 'fisse'], ['Assic. Casa', 'Credit Agricole', 'fisse'], ['Wi-Fi', 'Credit Agricole', 'fisse'], ['Bollette', 'Credit Agricole', 'fisse'], ['TARI', 'Credit Agricole', 'fisse'], ['Spese condominiali', 'Credit Agricole', 'fisse'], ['Accantonamento', 'Credit Agricole', 'fisse'], ['Telefono', 'Credit Agricole', 'fisse'], ['AMEX (T-1)', 'Amex', 'carta'], ['Investimento ETF', 'Trade ETF', 'investimento']];
    return { v: 1, settings: { redditoAtteso: 0, arrot: 10, inizio: C.nowKey() }, voci: vs.map(function (x) { return { id: C.slug(x[0]), nome: x[0], conto: x[1], gruppo: x[2], importo: 0, stima: x[0] === 'Bollette' }; }), mesi: {} };
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    switch (a) {
      case 'tab': ui.tab = t.getAttribute('data-tab'); try { localStorage.setItem(TAB_KEY, ui.tab); } catch (er) { } render(); window.scrollTo(0, 0); break;
      case 'prev': goMonth(-1); break;
      case 'next': goMonth(1); break;
      case 'oggi': ui.month = focusMonth(); render(); break;
      case 'gomonth': ui.month = t.getAttribute('data-k'); ui.tab = 'mese'; try { localStorage.setItem(TAB_KEY, 'mese'); } catch (er) { } render(); window.scrollTo(0, 0); break;
      case 'toggle': {
        var tk = ui.month, m = ensure(tk), was = fisseSaldate(tk), nowPaid = !m.pagati[id], vv = voce(id);
        var apply = function () {
          if (nowPaid) m.pagati[id] = true; else delete m.pagati[id];
          save();
          if (!was && fisseSaldate(tk)) ui.celebrate = true;
          render();
          if (ui.celebrate) {
            setTimeout(function () { ui.celebrate = false; }, 50);
            toast(cap(C.MESI[C.parseKey(tk).m - 1]) + ' saldato · alla prossima apertura vedi ' + C.MESI[C.parseKey(C.addM(tk, 1)).m - 1]);
          } else {
            toast((vv ? vv.nome : 'Voce') + (nowPaid ? ' pagato' : ' da pagare'), { label: 'Annulla', fn: function () { if (nowPaid) delete m.pagati[id]; else m.pagati[id] = true; save(); render(); } });
          }
        };
        var li = t.closest('li');
        if (li && !REDUCED) { li.classList.add(nowPaid ? 'going' : 'coming'); setTimeout(apply, 260); } else apply();
        break;
      }
      case 'fold': ui.showPaid = !ui.showPaid; render(); break;
      case 'privacy': {
        var on = document.documentElement.classList.toggle('privacy');
        try { localStorage.setItem('finanze-ale-privacy', on ? '1' : '0'); } catch (er) { }
        render(); toast(on ? 'Importi nascosti' : 'Importi visibili'); break;
      }
      case 'copy': {
        var txt = C.r2(+t.getAttribute('data-v')).toFixed(2).replace('.', ',');
        var ok = function () { toast('Copiato ' + txt + ' · incollalo nel bonifico'); };
        var fb = function () { var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); try { document.execCommand('copy'); ok(); } catch (er) { toast('Non riesco a copiare'); } ta.remove(); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
        break;
      }
      case 'amt': sheetAmt(id); break;
      case 'reddito': sheetReddito(); break;
      case 'amex': sheetAmex(); break;
      case 'amexauto': delete ensure(ui.month).amexLimite; save(); closeSheet(); render(); toast('Torno al calcolo automatico'); break;
      case 'spostato': {
        var ms = ensure(ui.month), cs = C.calc(db, ui.month);
        var already = ms.spostato && Math.abs(C.r2(cs.spostare - (+ms.spostato.importo || 0))) < 0.5;
        if (already) { delete ms.spostato; toast('Trasferimento da fare'); }
        else { ms.spostato = { data: todayISO(), importo: cs.spostare }; toast('Trasferimento segnato come fatto'); }
        save(); render(); break;
      }
      case 'redditonext': ui.month = C.addM(ui.month, 1); render(); window.scrollTo(0, 0); sheetReddito(); break;
      case 'clearred': ensure(ui.month).reddito = null; save(); closeSheet(); render(); toast('Torno alla stima'); break;
      case 'newvoce': sheetVoce(null); break;
      case 'editvoce': sheetVoce(id); break;
      case 'delvoce': closeSheet(); setTimeout(function () {
        var v = voce(id);
        sheetConfirm('Eliminare «' + v.nome + '»?', 'La voce sparisce da tutti i mesi, insieme ai suoi importi e alle spunte.', 'Elimina', function () {
          db.voci = db.voci.filter(function (x) { return x.id !== id; });
          Object.keys(db.mesi).forEach(function (k) { delete db.mesi[k].importi[id]; delete db.mesi[k].pagati[id]; });
          save(); render(); toast('Voce eliminata');
        });
      }, 280); break;
      case 'export': sheetExport(); break;
      case 'sharefile': shareFile(); break;
      case 'copycode': copyCode(); break;
      case 'paste': sheetPaste(); break;
      case 'blank': db = blankDb(); save(); render(); toast('Modello creato: completa le voci in Impostazioni'); break;
      case 'wipe': sheetConfirm('Cancellare tutti i dati?', 'Voci, importi, cedolini e spunte verranno eliminati da questo dispositivo. Esporta prima un backup se ti serve.', 'Cancella tutto', function () {
        db = null; try { localStorage.removeItem(KEY); } catch (er) { } render();
      }); break;
      case 'close': closeSheet(); break;
    }
  });
  $scrim.addEventListener('click', closeSheet);
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'sheet-form') return;
    e.preventDefault();
    if (sheetSubmit) sheetSubmit();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$sheet.hidden) closeSheet(); });
  document.addEventListener('change', function (e) {
    var t = e.target, w = t.getAttribute('data-change');
    if (!w) return;
    if (w === 'file') { importFile(t.files && t.files[0]); t.value = ''; }
    else if (w === 'atteso') { var n = parseNum(t.value); if (isFinite(n) && n >= 0) { db.settings.redditoAtteso = C.r2(n); save(); toast('Stima aggiornata'); } else { toast('Importo non valido'); t.value = numStr(db.settings.redditoAtteso); } }
    else if (w === 'stima') {
      var si = +t.getAttribute('data-i'), sn = t.value.trim() === '' ? null : parseNum(t.value);
      if (sn === null || (isFinite(sn) && sn >= 0)) {
        if (!Array.isArray(db.settings.stimeCedolino)) db.settings.stimeCedolino = [null, null, null, null, null, null, null, null, null, null, null, null];
        db.settings.stimeCedolino[si] = sn === null ? null : C.r2(sn); save(); toast('Stima di ' + C.MESI[si] + ' aggiornata');
      } else { toast('Importo non valido'); t.value = numStr((db.settings.stimeCedolino || [])[si]); }
    }
    else if (w === 'invbase') { var iv = parseNum(t.value); if (isFinite(iv) && iv >= 0) { db.settings.investitoBase = C.r2(iv); db.settings.investitoRif = C.nowKey(); save(); render(); toast('Totale investito aggiornato'); } else { toast('Importo non valido'); t.value = numStr(db.settings.investitoBase || 0); } }
    else if (w === 'arrot') { db.settings.arrot = +t.value; save(); toast('Arrotondamento aggiornato'); }
  });

  var toastT = null;
  function toast(msg, action) {
    var el = document.getElementById('toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button" class="toast-btn">' + esc(action.label) + '</button>' : '');
    el.classList.toggle('has-action', !!action);
    if (action) el.querySelector('.toast-btn').onclick = function () { el.classList.remove('on'); action.fn(); };
    el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, action ? 4000 : 2400);
  }
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }

  /* Cambio mese con scorrimento */
  function goMonth(dir) {
    if (dir < 0 && ui.month <= startKey()) return;
    ui.month = C.addM(ui.month, dir); ui.slide = dir > 0 ? 'l' : 'r'; render();
  }
  var tx = null;
  $main.addEventListener('touchstart', function (e) { if (e.touches.length === 1) tx = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
  $main.addEventListener('touchend', function (e) {
    if (!tx || ui.tab !== 'mese' || !$sheet.hidden || !db) { tx = null; return; }
    var dx = e.changedTouches[0].clientX - tx.x, dy = e.changedTouches[0].clientY - tx.y, dt = Date.now() - tx.t; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50 && dt < 700) goMonth(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* Animazioni: anello che si riempie e cifre che scorrono */
  function fmtCount(f, v, target) {
    if (f === 'pct') return Math.round(v) + '%';
    if (f === 'f') return eur(v);
    var whole = Math.abs(target - Math.round(target)) < 0.005;
    var str = whole ? eur0(v) : eur(v);
    return f === 'amex' ? '+' + str : str;
  }
  function animateIn() {
    var arc = $main.querySelector('.ring-arc');
    if (arc) {
      var p = +arc.getAttribute('data-p');
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        if (p > 0.001) arc.style.opacity = '';
        arc.setAttribute('stroke-dashoffset', arc.getAttribute('data-to'));
        if (p <= 0.001) setTimeout(function () { arc.style.opacity = '0'; }, 500);
      }); });
      ui.prev.ring = p;
    }
    var els = document.querySelectorAll('[data-count]');
    Array.prototype.forEach.call(els, function (el) {
      var key = el.getAttribute('data-count'), to = +el.getAttribute('data-val'), f = el.getAttribute('data-fmt');
      var from = ui.prev[key] !== undefined ? ui.prev[key] : 0;
      ui.prev[key] = to;
      if (REDUCED || Math.abs(from - to) < 0.005) { el.textContent = fmtCount(f, to, to); return; }
      var t0 = null, dur = 550;
      var step = function (ts) {
        if (t0 === null) t0 = ts;
        var q = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - q, 3);
        el.textContent = fmtCount(f, from + (to - from) * e, to);
        if (q < 1) requestAnimationFrame(step);
      };
      el.textContent = fmtCount(f, from, to);
      requestAnimationFrame(step);
    });
  }

  // when the app comes back to the foreground on a new month, jump to it
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
    if (db && hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000 && $sheet.hidden) { ui.month = focusMonth(); render(); }
  });

  db = load();
  if (db && db.settings && db.settings.investitoBase === undefined && window.FIN_SEED && window.FIN_SEED.settings) { db.settings.investitoBase = window.FIN_SEED.settings.investitoBase || 0; db.settings.investitoRif = window.FIN_SEED.settings.investitoRif; save(); }
  if (!db && window.FIN_SEED && C.valid(window.FIN_SEED)) { db = JSON.parse(JSON.stringify(window.FIN_SEED)); save(); }
  if (db && db.settings && !Array.isArray(db.settings.stimeCedolino) && window.FIN_SEED && window.FIN_SEED.settings && window.FIN_SEED.settings.stimeCedolino) { db.settings.stimeCedolino = window.FIN_SEED.settings.stimeCedolino.slice(); save(); }
  if (db) {
    var ren = false;
    db.voci.forEach(function (v) { if (/^pagamenti amex \(t-1\)$/i.test(v.nome)) { v.nome = 'AMEX (T-1)'; ren = true; } });
    if (ren) save();
    ui.month = focusMonth();
  }
  render();

  if (window.FIN_PWA) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  }
})();

</script>
</body>
</html>
