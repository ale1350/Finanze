<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanze</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanze">
<meta name="theme-color" content="#EDF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1211" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: una colonna stile app iPhone (max 560px), header mese sticky, tab bar fissa in basso.
   Palette "petrolio": vincolo = petrolio scuro, investimento = menta, spese varie = zafferano (gli stessi colori dell'icona). */
:root {
  --bg: #EDF2F0;
  --surface: #FFFFFF;
  --surface-2: #F5F8F7;
  --ink: #10201E;
  --muted: #5B6D69;
  --line: #DCE5E2;
  --accent: #0B5E59;
  --accent-ink: #FFFFFF;
  --hero: #0B4B47;
  --hero-ink: #F2FBF9;
  --hero-muted: #A9CFC9;
  --c-vincolo: #123B3A;
  --c-inv: #26A98F;
  --c-varie: #E7A03A;
  --ok: #1D8457;
  --ok-bg: #DCF1E5;
  --warn: #9A6412;
  --warn-bg: #FBEED3;
  --bad: #BD3F35;
  --bad-bg: #FBE2DE;
  --shadow: 0 1px 2px rgba(16, 32, 30, .06), 0 6px 24px rgba(16, 32, 30, .06);
  --f-display: "Archivo", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1211; --surface: #141E1C; --surface-2: #1A2624; --ink: #E3EEEB; --muted: #8EA39E; --line: #24322F;
    --accent: #3FC0AD; --accent-ink: #062321; --hero: #0F4A45; --hero-ink: #ECFAF7; --hero-muted: #93C7BF;
    --c-vincolo: #4F837D; --c-inv: #39C3A6; --c-varie: #F0B04F;
    --ok: #4FCB8C; --ok-bg: #163425; --warn: #F0B04F; --warn-bg: #3A2C12; --bad: #F2796D; --bad-bg: #3D1D1A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1211; --surface: #141E1C; --surface-2: #1A2624; --ink: #E3EEEB; --muted: #8EA39E; --line: #24322F;
  --accent: #3FC0AD; --accent-ink: #062321; --hero: #0F4A45; --hero-ink: #ECFAF7; --hero-muted: #93C7BF;
  --c-vincolo: #4F837D; --c-inv: #39C3A6; --c-varie: #F0B04F;
  --ok: #4FCB8C; --ok-bg: #163425; --warn: #F0B04F; --warn-bg: #3A2C12; --bad: #F2796D; --bad-bg: #3D1D1A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; margin: 0; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-stretch: 108%; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
.top .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px 8px; }
.top h1 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 750; font-size: 26px; letter-spacing: -.01em; flex: 1; min-width: 0; text-transform: capitalize; text-wrap: balance; }
.top h1 small { display: block; font-family: var(--f-body); font-stretch: 100%; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.navbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.navbtn svg { width: 18px; height: 18px; }
.today { border: 0; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; border-radius: 99px; padding: 6px 10px; flex: none; }

main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
main .wrap { display: grid; gap: 14px; padding-block: 6px 12px; }

/* hero */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 24px; padding: 18px 20px 18px; display: grid; gap: 8px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c-inv) 38%, transparent), transparent 70%); pointer-events: none; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.hero .eyebrow { color: var(--hero-muted); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.hero-num { font-size: clamp(38px, 11vw, 52px); font-weight: 760; line-height: 1; letter-spacing: -.02em; }
.hero-num.neg { color: #FFB4AA; }
.hero-sub { color: var(--hero-muted); font-size: 13.5px; }
.hero-sub b { color: var(--hero-ink); font-weight: 650; }
.meter { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--hero-ink) 16%, transparent); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: inherit; background: var(--c-varie); transition: width .5s cubic-bezier(.2, .8, .2, 1); }

/* cards */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > header { display: flex; align-items: center; gap: 10px; }
.card h2 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 18px; font-weight: 720; flex: 1; letter-spacing: -.005em; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.count { font-size: 13px; font-weight: 700; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 8px; letter-spacing: .02em; white-space: nowrap; }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.hero .pill-warn { background: color-mix(in srgb, var(--c-varie) 26%, transparent); color: #FFD9A0; }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-mute { background: var(--surface-2); color: var(--muted); }

/* flow bar */
.flow { display: flex; height: 18px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.flow span { display: block; height: 100%; min-width: 2px; transition: flex-grow .5s; }
.f-vin { background: var(--c-vincolo); } .f-inv { background: var(--c-inv); } .f-var { background: var(--c-varie); }
.legend { display: grid; gap: 0; margin: 0; }
.legend > div { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.legend > div:first-child { border-top: 0; }
.legend dt { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 550; }
.legend dt small { color: var(--warn); font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.legend dd { margin: 0; font-weight: 650; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.editable { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 650; border-bottom: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); }
.move { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.move .lbl { flex: 1; font-weight: 650; line-height: 1.25; }
.move .lbl small { display: block; color: var(--muted); font-weight: 450; font-size: 12.5px; }
.move .num { font-size: 22px; font-weight: 760; color: var(--accent); }

/* progress */
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: inherit; transition: width .45s cubic-bezier(.2, .8, .2, 1); }

/* list of payments */
.group { margin: 6px 0 -4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 56px; }
.list .row:first-child { border-top: 0; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); flex: none; display: grid; place-items: center; padding: 0; transition: background .2s, border-color .2s, transform .15s; }
.check svg { width: 16px; height: 16px; stroke: var(--accent-ink); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.check:active { transform: scale(.9); }
.row.paid .check { background: var(--ok); border-color: var(--ok); }
.row.paid .check svg { opacity: 1; transform: scale(1); stroke: #fff; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.name { font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.amt { border: 0; background: var(--surface-2); border-radius: 10px; padding: 7px 10px; font-weight: 650; font-size: 15px; white-space: nowrap; }
.row.paid .amt { color: var(--ok); background: var(--ok-bg); }
.row.zero { opacity: .55; }
.row.est .amt { font-style: italic; color: var(--warn); background: var(--warn-bg); }
.row.late .amt { color: var(--bad); background: var(--bad-bg); }

/* movimenti */
.mov { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.list .mov:first-child { border-top: 0; }
.mov .day { width: 40px; flex: none; text-align: center; line-height: 1.05; }
.mov .day b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 720; }
.mov .day small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.mov .num { font-weight: 680; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { color: var(--muted); font-size: 13.5px; background: var(--surface-2); border-radius: 12px; padding: 14px; margin: 0; }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-danger { background: var(--bad-bg); color: var(--bad); }
.btn-small { padding: 7px 12px; font-size: 13px; border-radius: 99px; }
.btn-block { width: 100%; }

.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent); display: grid; place-items: center; z-index: 25; }
.fab svg { width: 26px; height: 26px; }
@media (min-width: 640px) { .fab { right: calc(50% - 280px + 16px); } }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { border: 0; background: none; padding: 9px 0 8px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 650; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* chart */
.chart-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 10.5px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .now text { fill: var(--ink); font-weight: 700; }
.chart .bar-hit { fill: transparent; cursor: pointer; }
.chart .sel rect.outline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.keys { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat .eyebrow { color: var(--muted); font-size: 10.5px; }
.stat .num { font-size: 19px; font-weight: 720; }
.stat small { color: var(--muted); font-size: 12px; }
.heavy { display: grid; gap: 8px; }
.heavy button { border: 0; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; text-align: left; display: grid; gap: 3px; }
.heavy .h1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 680; text-transform: capitalize; }
.heavy small { color: var(--muted); font-size: 12.5px; }

/* settings */
.field { display: grid; gap: 6px; }
.field label, .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.input, select.input, textarea.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; }
.input-big { font-family: var(--f-display); font-size: 30px; font-weight: 720; font-stretch: 110%; padding: 12px 16px; }
textarea.input { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 110px; resize: vertical; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.list .setrow:first-child { border-top: 0; }
.setrow .row-main { flex: 1; }
.chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1.5px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-transform: none; letter-spacing: 0; color: var(--ink); }
.seg input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 14, .45); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .9, .2, 1); }
.sheet.on { transform: none; }
.sheet .panel { max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 88vh; overflow-y: auto; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 2px; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 20px; font-weight: 720; text-wrap: balance; }
.sheet .actions { display: flex; gap: 10px; }
.sheet .actions .btn { flex: 1; }
.err { color: var(--bad); font-size: 13px; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* onboarding */
.welcome { display: grid; gap: 18px; padding-block: 28px 40px; }
.welcome .mark { width: 72px; height: 72px; border-radius: 20px; background: var(--hero); display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 14px 14px 16px; }
.welcome .mark i { display: block; width: 10px; border-radius: 4px 4px 2px 2px; }
.welcome h2 { margin: 0; font-family: var(--f-display); font-stretch: 115%; font-size: 34px; font-weight: 780; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 46ch; }
.choices { display: grid; gap: 10px; }
.choice { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; text-align: left; display: grid; gap: 3px; }
.choice b { font-size: 16px; }
.choice span { color: var(--muted); font-size: 13.5px; }
.choice.primary { border-color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* hero: ripartizione del cedolino */
.hero-flow { height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--hero-ink) 14%, transparent); margin-top: 6px; }
.hero .f-vin { background: color-mix(in srgb, var(--hero-ink) 78%, var(--hero)); }
.hero .dot.f-vin { background: color-mix(in srgb, var(--hero-ink) 78%, var(--hero)); }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 6px 0 0; }
.hero-grid > div { display: grid; gap: 2px; min-width: 0; }
.hero-grid dt { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--hero-muted); }
.hero-grid dd { margin: 0; display: grid; gap: 1px; justify-items: start; }
.hero-grid .num { font-size: 18px; font-weight: 700; color: var(--hero-ink); }
.hero-grid small { font-size: 12px; color: var(--hero-muted); }
.hero .editable { color: var(--hero-ink); border-bottom-color: color-mix(in srgb, var(--c-varie) 80%, transparent); font-size: 18px; }
.hero-num { margin-top: 2px; }

.nudge { border: 1.5px dashed color-mix(in srgb, var(--c-varie) 70%, transparent); background: var(--warn-bg); border-radius: var(--r); padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; }
.nudge span { flex: 1; display: grid; gap: 2px; min-width: 0; }
.nudge b { color: var(--ink); }
.nudge small { color: var(--muted); font-size: 13px; }

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav class="tabs" id="tabs" hidden aria-label="Sezioni"></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Modifica"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.FIN_PWA = true; window.FIN_SEED = null; window.FIN_XLSX_SRC = 'xlsx.mini.min.js';</script>
<script>
/* Finanze — logica pura (mesi, calcoli, import dal file Excel). Funziona sia nel browser sia in Node. */
(function (root) {
  'use strict';
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function keyOf(y, m) { return y + '-' + pad(m); }

      if (d.k === ui.month) s += '<rect class="outline" x="' + (x - 3) + '" y="' + (y0 - h1 - h2 - h3 - 3).toFixed(1) + '" width="' + (bw + 6) + '" height="' + (h1 + h2 + h3 + 6).toFixed(1) + '" rx="5"/>';

  function viewAnno() {

      });

  function shareFile() {
    var json = JSON.stringify(db, null, 1);
    var name = 'finanze-backup-' + todayISO() + '.json';
    var file;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function (e) { if (e && e.name !== 'AbortError') toast('Usa «Copia codice»'); });
      return;
    }
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      toast('Se il file non compare, usa «Copia codice»');
    } catch (e) { toast('Usa «Copia codice»'); }
  }
  function copyCode() {
    var ta = document.getElementById('s-code');
    var done = function () { toast('Codice copiato'); };
    var fallback = function () { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); try { document.execCommand('copy'); done(); } catch (e) { toast('Seleziona il testo e copialo'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback); else fallback();
  }

  function decodeBackup(txt) {
    txt = String(txt || '').trim();
    var d;
    if (txt.charAt(0) === '{') d = JSON.parse(txt);
    else d = JSON.parse(decodeURIComponent(escape(atob(txt.replace(/\s/g, '')))));
    if (!C.valid(d)) throw new Error('Il codice non contiene un backup di Finanze.');
    return d;
  }
  function replaceData(d, msg) {
    var go = function () { db = d; save(); ui.month = C.nowKey(); ui.tab = 'mese'; closeSheet(); render(); toast(msg); };
    if (db) sheetConfirm('Sostituire i dati attuali?', 'I dati presenti su questo dispositivo verranno sostituiti con quelli importati.', 'Sostituisci', go);
    else go();
  }
  function sheetPaste() {
    openSheet('<h3>Incolla codice di backup</h3><div class="field"><label for="s-paste">Codice</label><textarea class="input" id="s-paste" placeholder="Incolla qui il codice"></textarea></div>' + ERR + ACTIONS('Importa'),
      function () {
        try { var d = decodeBackup(document.getElementById('s-paste').value); } catch (e) { return showErr('Codice non valido. Copialo di nuovo per intero.'); }
        closeSheet(); setTimeout(function () { replaceData(d, 'Backup importato'); }, 280);
      }, 's-paste');
  }

  var xlsxLoading = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xlsxLoading) return xlsxLoading;
    xlsxLoading = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = window.FIN_XLSX_SRC;
      s.onload = function () { window.XLSX ? res(window.XLSX) : rej(new Error('x')); };
      s.onerror = function () { xlsxLoading = null; rej(new Error('Non riesco a caricare il lettore Excel. Controlla la connessione e riprova.')); };
      document.head.appendChild(s);
    });
    return xlsxLoading;
  }
  function importFile(file) {
    if (!file) return;
    var isJson = /\.json$/i.test(file.name) || file.type === 'application/json';
    var r = new FileReader();
    r.onerror = function () { toast('Non riesco a leggere il file'); };
    if (isJson) {
      r.onload = function () { try { replaceData(decodeBackup(r.result), 'Backup importato'); } catch (e) { toast('Il file non è un backup di Finanze'); } };
      r.readAsText(file);
    } else {
      toast('Leggo il file…');
      r.onload = function () {
        loadXLSX().then(function (X) {
          var wb = X.read(new Uint8Array(r.result), { type: 'array' });
          var d = C.parseWorkbook(X, wb);
          replaceData(d, 'Importate ' + d.voci.length + ' voci e ' + Object.keys(d.mesi).length + ' mesi');
        }).catch(function (e) { toast(e && e.message ? e.message : 'Il file Excel non è nel formato atteso'); });
      };
      r.readAsArrayBuffer(file);
    }
  }

    return { v: 1, settings: { redditoAtteso: 0, arrot: 10, inizio: C.nowKey() }, voci: vs.map(function (x) { return { id: C.slug(x[0]), nome: x[0], conto: x[1], gruppo: x[2], importo: 0, stima: x[0] === 'Bollette' }; }), mesi: {} };

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    switch (a) {
      case 'tab': ui.tab = t.getAttribute('data-tab'); try { localStorage.setItem(TAB_KEY, ui.tab); } catch (er) { } render(); window.scrollTo(0, 0); break;
      case 'prev': ui.month = C.addM(ui.month, -1); render(); break;
      case 'next': ui.month = C.addM(ui.month, 1); render(); break;
      case 'oggi': ui.month = C.nowKey(); render(); break;
      case 'gomonth': ui.month = t.getAttribute('data-k'); ui.tab = 'mese'; try { localStorage.setItem(TAB_KEY, 'mese'); } catch (er) { } render(); window.scrollTo(0, 0); break;
      case 'toggle': {
        var m = ensure(ui.month);
        if (m.pagati[id]) delete m.pagati[id]; else m.pagati[id] = true;
        save(); render();
        break;
      }
      case 'amt': sheetAmt(id); break;
      case 'reddito': sheetReddito(); break;
      case 'redditonext': ui.month = C.addM(ui.month, 1); render(); window.scrollTo(0, 0); sheetReddito(); break;
      case 'clearred': ensure(ui.month).reddito = null; save(); closeSheet(); render(); toast('Torno alla stima'); break;
      case 'newvoce': sheetVoce(null); break;
      case 'editvoce': sheetVoce(id); break;
      case 'delvoce': closeSheet(); setTimeout(function () {
        var v = voce(id);
        sheetConfirm('Eliminare «' + v.nome + '»?', 'La voce sparisce da tutti i mesi, insieme ai suoi importi e alle spunte.', 'Elimina', function () {
          db.voci = db.voci.filter(function (x) { return x.id !== id; });
          Object.keys(db.mesi).forEach(function (k) { delete db.mesi[k].importi[id]; delete db.mesi[k].pagati[id]; });
          save(); render(); toast('Voce eliminata');
        });
      }, 280); break;
      case 'export': sheetExport(); break;
      case 'sharefile': shareFile(); break;
      case 'copycode': copyCode(); break;
      case 'paste': sheetPaste(); break;
      case 'blank': db = blankDb(); save(); render(); toast('Modello creato: completa le voci in Impostazioni'); break;
      case 'wipe': sheetConfirm('Cancellare tutti i dati?', 'Voci, importi, cedolini e spunte verranno eliminati da questo dispositivo. Esporta prima un backup se ti serve.', 'Cancella tutto', function () {
        db = null; try { localStorage.removeItem(KEY); } catch (er) { } render();
      }); break;
      case 'close': closeSheet(); break;
    }
  });
  $scrim.addEventListener('click', closeSheet);
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'sheet-form') return;
    e.preventDefault();
    if (sheetSubmit) sheetSubmit();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$sheet.hidden) closeSheet(); });
  document.addEventListener('change', function (e) {
    var t = e.target, w = t.getAttribute('data-change');
    if (!w) return;
    if (w === 'file') { importFile(t.files && t.files[0]); t.value = ''; }
    else if (w === 'atteso') { var n = parseNum(t.value); if (isFinite(n) && n >= 0) { db.settings.redditoAtteso = C.r2(n); save(); toast('Stima aggiornata'); } else { toast('Importo non valido'); t.value = numStr(db.settings.redditoAtteso); } }
    else if (w === 'invbase') { var iv = parseNum(t.value); if (isFinite(iv) && iv >= 0) { db.settings.investitoBase = C.r2(iv); db.settings.investitoRif = C.nowKey(); save(); render(); toast('Totale investito aggiornato'); } else { toast('Importo non valido'); t.value = numStr(db.settings.investitoBase || 0); } }
    else if (w === 'arrot') { db.settings.arrot = +t.value; save(); toast('Arrotondamento aggiornato'); }
  });

  var toastT = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }

  // when the app comes back to the foreground on a new month, jump to it
  var lastNow = C.nowKey();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && C.nowKey() !== lastNow) { lastNow = C.nowKey(); ui.month = lastNow; render(); }
  });

  db = load();
  if (db && db.settings && db.settings.investitoBase === undefined && window.FIN_SEED && window.FIN_SEED.settings) { db.settings.investitoBase = window.FIN_SEED.settings.investitoBase || 0; db.settings.investitoRif = window.FIN_SEED.settings.investitoRif; save(); }
  if (!db && window.FIN_SEED && C.valid(window.FIN_SEED)) { db = JSON.parse(JSON.stringify(window.FIN_SEED)); save(); }
  render();

  if (window.FIN_PWA) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  }
})();

</script>
</body>
</html>
