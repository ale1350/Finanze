<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanze</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanze">
<meta name="theme-color" content="#EEEFF1">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: tre pagine affiancate da scorrere (Mese · Andamento · Impostazioni), nessun menu in basso.
   Mese: carte impilate (Trade Republic / AMEX), blocco Credit Agricole con il vincolo, timeline delle scadenze.
   Tema grigio chiaro; il colore lo portano i conti: Trade nero, AMEX verde, Credit Agricole petrolio. */
:root {
  color-scheme: light;
  --bg: #EEEFF1;
  --surface: #FFFFFF;
  --surface-2: #E4E6EA;
  --ink: #17181B;
  --muted: #6B7079;
  --dim: #7C818A;
  --line: #D9DCE1;
  --line-strong: #B5BAC2;
  --ok: #2E9461;
  --ok-ink: #FFFFFF;
  --bad: #C2412F;
  --bad-on-dark: #FF9B8E;
  --trade: #17181B;
  --trade-ink: #F3F3F1;
  --trade-muted: #A3A7AE;
  --amex: #557760;
  --amex-ink: #E6F0E8;
  --amex-muted: #C3D6C8;
  --ca: #0E6F7A;
  --f-display: "Archivo", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; margin: 0; height: 100%; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-stretch: 110%; }
.bad { color: var(--bad) !important; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* ---- pagine a scorrimento ---- */
.pages { height: 100%; width: 100%; max-width: 100vw; display: flex; contain: layout paint; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.pages::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-align: start; scroll-snap-stop: always; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.page main { padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
.page main > .wrap { display: grid; gap: 20px; padding-block: 6px 12px; }
body.welcome-mode .page:not(#pg-mese) { display: none; }
.dots { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 25; display: flex; gap: 4px; padding: 6px 8px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.dot-btn { border: 0; background: none; padding: 6px 3px; display: grid; place-items: center; }
.dot-btn span { display: block; width: 7px; height: 7px; border-radius: 99px; background: var(--line-strong); transition: width .25s, background .25s; }
.dot-btn[aria-current="page"] span { width: 22px; background: var(--ink); }

/* ---- header ---- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 6px; padding-block: 12px 8px; }
.top h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 28px; letter-spacing: -.01em; }
.top h1 small { display: block; font-family: var(--f-body); font-stretch: 100%; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.mhead h1 { text-align: center; display: grid; gap: 1px; justify-items: center; }
.mtitle { font-size: 21px; text-transform: capitalize; }
.mtag { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.mtag.link { border: 0; background: none; padding: 2px 4px; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.navbtn { width: 44px; height: 44px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; flex: none; padding: 0; }
.navbtn svg { width: 22px; height: 22px; stroke-width: 2.8; }
.navbtn:disabled { opacity: .25; cursor: default; }

/* ---- carte ---- */
.stack { position: relative; height: 262px; }
.card-back { position: absolute; left: 8px; right: 8px; top: 0; height: 200px; border: 0; border-radius: 22px; padding: 15px 18px; display: flex; justify-content: space-between; align-items: flex-start; text-align: left; }
.card-front { position: absolute; left: 0; right: 0; top: 50px; height: 212px; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 -10px 30px rgba(20, 24, 30, .22); }
.card-back.trade, .card-front.trade { background: var(--trade); color: var(--trade-ink); }
.card-back.amex, .card-front.amex { background: var(--amex); color: var(--amex-ink); }
.cname { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding-top: 2px; }
.cmeta { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; }
.card-back .num.cmeta { font-size: 18px; font-weight: 800; }
.card-back.trade .cmeta { color: var(--trade-muted); }
.okdot { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
.okdot svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3.6; }
.ctop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.cside { font-size: 20px; font-weight: 800; }
.cbottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.cmain { display: grid; gap: 2px; min-width: 0; }
.clab { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.trade .clab { color: var(--trade-muted); }
.amex .clab { color: var(--amex-muted); }
.cbig { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.t-copy { border: 0; background: none; padding: 0; color: inherit; display: inline-flex; align-items: center; gap: 8px; text-align: left; }
.t-copy svg { width: 18px; height: 18px; opacity: .55; flex: none; }
.t-copy:active .cbig { opacity: .6; }
.t-copy.manual .cbig { text-decoration: underline; text-decoration-style: dotted; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.card-back.amex.manual .cmeta { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; }
.t-check { width: 56px; height: 56px; border-radius: 50%; border: 3px solid currentColor; background: transparent; color: inherit; display: grid; place-items: center; padding: 0; flex: none; transition: transform .15s; }
.t-check svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 3; }
.t-check:active { transform: scale(.9); }
.t-check.partial { border-style: dashed; }
.swap-in { animation: swapin .42s cubic-bezier(.2, .9, .2, 1); }
.swap-out { animation: swapout .3s ease forwards; }
@keyframes swapin { from { transform: translateY(-46px) scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes swapout { to { transform: translateY(26px) scale(.98); opacity: 0; } }

/* ---- cedolino + privacy ---- */
.cedrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -4px; }
.ced { border: 0; background: none; padding: 0; text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); }
.ced u { color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.eye { width: 40px; height: 40px; border: 2px solid var(--line); border-radius: 50%; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; flex: none; }
.eye svg { width: 19px; height: 19px; }
.eye[aria-pressed="true"] { color: var(--ink); border-color: var(--line-strong); }
html.privacy .num, html.privacy .amt, html.privacy .ca-sub, html.privacy .cmeta { filter: blur(9px); transition: filter .25s; }
html.privacy .t-copy { pointer-events: none; }
.nudge { border: 2px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; }
.nudge span { flex: 1; display: grid; gap: 2px; min-width: 0; }
.nudge small { color: var(--muted); font-size: 13px; }
.chev { width: 18px; height: 18px; color: var(--muted); flex: none; }

/* ---- Credit Agricole ---- */
.ca { display: grid; gap: 8px; }
.ca-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ca-lab { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ca-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--ca); }
.ca-val { font-size: 24px; font-weight: 800; }
.ca-bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.ca-bar span { display: block; height: 100%; border-radius: inherit; background: var(--ca); transition: width .7s cubic-bezier(.2, .8, .2, 1), background .3s; }
.ca.full .ca-bar span { background: var(--ok); }
.ca-sub { font-size: 12.5px; color: var(--muted); }
.ca.celebrate .ca-bar { animation: pulse .9s ease; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 148, 97, .5); } 100% { box-shadow: 0 0 0 12px rgba(46, 148, 97, 0); } }

/* ---- scadenze (timeline) ---- */
.pays header, .card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 6px; }
.pays h2, .card h2 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 17px; font-weight: 800; }
.count { font-size: 13px; font-weight: 600; color: var(--muted); text-align: right; }
.list { list-style: none; margin: 0; padding: 0; }
.tline { position: relative; }
.tline::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 0; min-height: 56px; position: relative; cursor: pointer; }
.row:active { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.tday { width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; background: var(--bg); padding: 3px 0; line-height: 1; position: relative; z-index: 1; }
.tday b { font-size: 18px; font-weight: 800; }
.tday small { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.tday .nod { font-size: 18px; color: var(--line-strong); }
.tname { flex: 1; min-width: 0; display: grid; gap: 1px; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); }
.amt { border: 0; background: none; padding: 8px 2px; font-weight: 700; font-size: 15.5px; white-space: nowrap; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--line-strong); background: transparent; flex: none; display: grid; place-items: center; padding: 0; transition: background .2s, border-color .2s, transform .15s; }
.check svg { width: 16px; height: 16px; stroke: var(--ok-ink); stroke-width: 3.6; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.check:active { transform: scale(.88); }
.row.paid .check { background: var(--ok); border-color: var(--ok); }
.row.paid .check svg { opacity: 1; transform: none; }
.row.paid .name, .row.paid .amt, .row.paid .tday b { color: var(--dim); }
.row.zero { opacity: .5; }
.row.est .amt { font-style: italic; color: var(--muted); }
.row.late .tag, .row.late .amt { color: var(--bad); }
.row.next .tag { color: var(--ink); font-weight: 700; }
.row.next .tday b { color: var(--ink); }
.row.next .tday::after { content: ""; position: absolute; right: 2px; top: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.row.going { animation: going .26s ease forwards; }
.row.coming { animation: coming .26s ease forwards; }
@keyframes going { to { opacity: 0; transform: translateX(24px); } }
@keyframes coming { to { opacity: 0; transform: translateY(-8px); } }
.fold { width: 100%; border: 0; border-top: 1.5px solid var(--line); background: none; padding: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 700; }
.fold svg { width: 18px; height: 18px; transition: transform .25s; }
.fold[aria-expanded="true"] svg { transform: rotate(180deg); }
.list-done { animation: fadein .3s ease; }
.alldone { display: flex; align-items: center; gap: 12px; padding: 14px 0; font-weight: 700; color: var(--ok); }
.alldone-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; flex: none; margin-left: 7px; }
.alldone-dot svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.6; }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.slide-l { animation: slidel .32s cubic-bezier(.2, .8, .2, 1); }
.slide-r { animation: slider .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes slidel { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slider { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

/* ---- sezioni (andamento, impostazioni) ---- */
.card { display: grid; gap: 12px; min-width: 0; background: var(--surface); border-radius: 20px; padding: 16px 18px 18px; }
.sub { margin: 0; color: var(--muted); font-size: 13.5px; }
.sub b { color: var(--ink); }
.note { font-size: 12.5px; color: var(--dim); margin: 0; }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 8px; white-space: nowrap; border: 1.5px solid var(--line-strong); color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1.5px solid var(--line); padding-top: 14px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .num { font-size: 22px; font-weight: 800; }
.stats3 .stat .num { font-size: 18px; }
.stat small { color: var(--dim); font-size: 12px; }
.etf-val { display: grid; gap: 4px; }
.etf-val .big { font-size: 42px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.etf-gain { font-size: 15px; font-weight: 800; }
.etf-gain.up { color: var(--ok); }
.etf-gain.down { color: var(--bad); }
.etf-gain span { color: var(--muted); font-weight: 600; }
.chart-wrap { display: grid; gap: 6px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 10.5px; }
.chart text.strong { fill: var(--ink); font-weight: 700; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; }
.chart .val { fill: none; stroke: var(--ok); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.chart .inv { fill: none; stroke: var(--dim); stroke-width: 2; stroke-dasharray: 5 4; }
.chart .area { fill: var(--ok); fill-opacity: .1; }
.chart .end { fill: var(--ok); stroke: var(--surface); stroke-width: 2.5; }
.keys { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.k-val { width: 16px; height: 3.5px; border-radius: 2px; background: var(--ok); }
.k-inv { width: 16px; height: 0; border-top: 2px dashed var(--dim); }
.tbl { display: grid; }
.tr { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; align-items: baseline; gap: 8px; padding: 11px 0; border: 0; border-top: 1.5px solid var(--line); background: none; text-align: right; width: 100%; font-size: 16px; }
.tr > :first-child { text-align: left; }
.tr .num { font-weight: 800; }
.tr .est { font-style: italic; color: var(--muted); }
.th { border-top: 0; padding: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tm { font-weight: 700; font-size: 15px; }
.tr2 { grid-template-columns: 70px 1fr auto; text-align: left; }
.tr2 .why { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr2 .num { text-align: right; }
.tbl > .tr:first-child:not(.th) { border-top: 0; }

/* ---- impostazioni e finestre ---- */
.field { display: grid; gap: 6px; }
.field label, .lab { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.input, select.input, textarea.input { width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-width: 0; }
.card .input { background: var(--bg); }
.input:focus { border-color: var(--ink); outline: none; }
.input-big { font-family: var(--f-display); font-size: 30px; font-weight: 800; font-stretch: 110%; padding: 12px 16px; }
textarea.input { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 110px; resize: vertical; }
.months { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.months .input { padding: 10px 8px; font-size: 15px; text-align: right; }
@media (max-width: 360px) { .months { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-top: 1.5px solid var(--line); width: 100%; background: none; text-align: left; }
.list li:first-child .setrow { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.setrow .name { white-space: normal; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ok); }
.btn { border: 2px solid var(--line-strong); border-radius: 12px; padding: 12px 16px; font-weight: 700; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-danger { border-color: var(--bad); color: var(--bad); }
.btn-small { padding: 6px 12px; font-size: 13px; border-radius: 99px; }
.btn-block { width: 100%; }
.scrim { position: fixed; inset: 0; background: rgba(20, 24, 30, .4); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .9, .2, 1); }
.sheet.on { transform: none; }
.sheet .panel { max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 88vh; overflow-y: auto; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line-strong); margin: 0 auto 2px; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 20px; font-weight: 800; text-wrap: balance; }
.sheet .actions { display: flex; gap: 10px; }
.sheet .actions .btn { flex: 1; }
.err { color: var(--bad); font-size: 13px; margin: 0; }
.toast { display: flex; align-items: center; gap: 14px; position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.has-action.on { pointer-events: auto; }
.toast-btn { border: 0; background: none; color: #7FD3A6; font-weight: 800; padding: 4px 2px; text-transform: uppercase; font-size: 12.5px; letter-spacing: .06em; }

/* ---- benvenuto ---- */
.welcome { display: grid; gap: 18px; padding-block: 36px 40px; }
.welcome .mark { width: 72px; height: 72px; }

<body>
<div class="pages" id="pages">
<section class="page" id="pg-mese" aria-label="Mese"></section>
<section class="page" id="pg-anno" aria-label="Andamento"></section>
<section class="page" id="pg-imp" aria-label="Impostazioni"></section>

<script>
/* Finanze — logica pura (mesi, calcoli, import dal file Excel). Funziona sia nel browser sia in Node. */
(function (root) {
  'use strict';
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function keyOf(y, m) { return y + '-' + pad(m); }
  function parseKey(k) { var p = String(k).split('-'); return { y: +p[0], m: +p[1] }; }
  function addM(k, n) { var p = parseKey(k); var t = p.y * 12 + (p.m - 1) + n; return keyOf(Math.floor(t / 12), (t % 12) + 1); }
  function nowKey(d) { d = d || new Date(); return keyOf(d.getFullYear(), d.getMonth() + 1); }
  function r2(v) { return Math.round((+v || 0) * 100) / 100; }
  var MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  function label(k) { var p = parseKey(k); return MESI[p.m - 1] + ' ' + p.y; }
  function shortLabel(k) { var p = parseKey(k); return MESI[p.m - 1].slice(0, 3) + ' ' + String(p.y).slice(2); }

  function emptyMese() { return { reddito: null, importi: {}, pagati: {}, mov: [] }; }
  function getM(db, k) { return db.mesi[k] || emptyMese(); }
  function hasVal(x) { return !(x === undefined || x === null || x === ''); }
  function amt(db, k, v) {
    var m = getM(db, k);
    var x = m.importi ? m.importi[v.id] : undefined;
    return hasVal(x) ? (+x || 0) : (+v.importo || 0);
  }

  /* Il cedolino del mese M-1 finanzia il mese M: la stima viene dalla tabella per mese di calendario. */
  function stimaCedolino(db, k) {
    var s = db.settings || {}, st = s.stimeCedolino, i = parseKey(addM(k, -1)).m - 1;
    if (st && hasVal(st[i]) && +st[i] > 0) return +st[i];
    return +s.redditoAtteso || 0;
  }

  function calc(db, k) {
    var m = getM(db, k), s = db.settings || {};
    var fisse = 0, inv = 0, tot = 0, pag = 0, nVoci = 0, nPag = 0, nF = 0, nFPag = 0, pagF = 0;
    db.voci.forEach(function (v) {
      var a = amt(db, k, v), isInv = v.gruppo === 'investimento', paid = !!(m.pagati && m.pagati[v.id]);
      if (isInv) inv += a; else fisse += a;
      tot += a;
      if (a > 0) {
        nVoci++; if (paid) { pag += a; nPag++; }
        if (!isInv) { nF++; if (paid) { pagF += a; nFPag++; } }
      }
    });
    pagF = r2(pagF);
    fisse = r2(fisse); inv = r2(inv); tot = r2(tot); pag = r2(pag);
    var vincolo = Math.ceil(fisse / 10 - 1e-9) * 10; // sempre per eccesso a 10 €
    var stima = !hasVal(m.reddito);
    var reddito = stima ? stimaCedolino(db, k) : +m.reddito;
    var varie = r2(reddito - vincolo - inv);
    var speso = r2((m.mov || []).reduce(function (a, x) { return a + (+x.importo || 0); }, 0));
    return {
      fisse: fisse, inv: inv, tot: tot, pag: pag, daPagare: r2(tot - pag), nVoci: nVoci, nPag: nPag,
      vincolo: vincolo, reddito: reddito, stima: stima, varie: varie, spostare: r2(varie + inv),
      speso: speso, residuo: r2(varie - speso), pct: tot > 0 ? pag / tot : 0,
      /* solo spese fisse (escluso l'investimento ETF) */
      nF: nF, nFPag: nFPag, pagF: pagF, daPagareF: r2(fisse - pagF), pctF: fisse > 0 ? pagF / fisse : 0
    };
  }

  /* Totale investito: base dichiarata (fino al mese di riferimento incluso) + investimenti spuntati dopo. */
  function investito(db, uptoK, soloPagati) {
    var s = db.settings || {}, base = +s.investitoBase || 0, rif = s.investitoRif || '0000-00';
    var tot = base;
    Object.keys(db.mesi).forEach(function (k) {
      if (k <= rif || k > uptoK) return;
      var m = db.mesi[k];
      db.voci.forEach(function (v) {
        if (v.gruppo !== 'investimento') return;
        if (soloPagati && !(m.pagati && m.pagati[v.id])) return;
        tot += amt(db, k, v);
      });
    });
    return r2(tot);
  }

  /* Spendibile con AMEX nel mese k: lo paghi il mese dopo, quindi = spese varie di k+1 (mai sotto 0). */
  function amexDisponibile(db, k) {
    var m = getM(db, k);
    var base = calc(db, addM(k, 1)).varie;
    var auto = r2(Math.max(0, base));
    if (hasVal(m.amexLimite)) return { val: Math.max(0, +m.amexLimite), manuale: true, auto: auto, base: base };
    return { val: auto, manuale: false, auto: auto, base: base };
  }

  function slug(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'voce';
  }
  function gruppoDa(txt) {
    var s = String(txt).toUpperCase();
    if (s.indexOf('INVEST') >= 0) return 'investimento';
    if (s.indexOf('CARTA') >= 0) return 'carta';
    return 'fisse';
  }
  function mode(arr) {
    var c = {}, best = 0, bestN = -1;
    arr.forEach(function (v) { c[v] = (c[v] || 0) + 1; if (c[v] > bestN) { bestN = c[v]; best = v; } });
    return best;
  }

  function valid(d) {
    return !!(d && d.v === 1 && Array.isArray(d.voci) && d.mesi && typeof d.mesi === 'object' && d.settings);
  }

  /* Legge il file Finanze_Ale.xlsx (fogli «Spese» ed «Economics»). XLSX = SheetJS. */
  function parseWorkbook(XLSX, wb) {
    var ws = wb.Sheets['Spese'];
    if (!ws) throw new Error('Nel file manca il foglio «Spese».');
    var get = function (r, c) { return ws[XLSX.utils.encode_cell({ r: r, c: c })]; };
    var txt = function (cell) { return cell && cell.v !== undefined && cell.v !== null ? String(cell.v).trim() : ''; };
    var hr = -1;
    for (var r = 0; r < 12; r++) { if (txt(get(r, 0)).toLowerCase() === 'voce') { hr = r; break; } }
    if (hr < 0) throw new Error('Non trovo la tabella delle spese: manca l\'intestazione «Voce» nel foglio Spese.');
    var cols = [];
    for (var c = 2; c < 300; c++) {
      var cell = get(hr, c);
      if (cell && typeof cell.v === 'number' && cell.v > 30000 && cell.v < 90000) {
        var d = XLSX.SSF.parse_date_code(cell.v);
        cols.push({ c: c, key: keyOf(d.y, d.m) });
      }
    }
    if (!cols.length) throw new Error('Non trovo i mesi nell\'intestazione del foglio Spese.');
    var mesi = {}, voci = [], used = {};
    cols.forEach(function (x) { mesi[x.key] = emptyMese(); });
    var gruppo = 'fisse', inSummary = false, redditoRow = -1;
    for (r = hr + 1; r < hr + 100; r++) {
      var a = txt(get(r, 0));
      if (!a) continue;
      if (a.toLowerCase().indexOf('reddito disponibile') === 0) { redditoRow = r; continue; }
      var up = a.toUpperCase();
      if (up.indexOf('RIEPILOGO') === 0 || up.indexOf('AVANZAMENTO') === 0) { inSummary = true; continue; }
      if (inSummary) continue;
      var b = txt(get(r, 1));
      if (!b) { gruppo = gruppoDa(a); continue; }
      var id = slug(a), n = 2; while (used[id]) id = slug(a) + '-' + (n++); used[id] = 1;
      var vals = [];
      cols.forEach(function (x) {
        var ce = get(r, x.c);
        var v = ce && typeof ce.v === 'number' ? r2(ce.v) : 0;
        mesi[x.key].importi[id] = v; vals.push(v);
        if (txt(get(r, x.c + 1))) mesi[x.key].pagati[id] = true;
      });
      var stima = /bollett/i.test(a);
      var def = stima ? Math.round(vals.reduce(function (s, v) { return s + v; }, 0) / vals.length) : mode(vals);
      voci.push({ id: id, nome: a, conto: b, gruppo: /invest/i.test(a) ? 'investimento' : gruppo, importo: def, stima: stima });
    }
    if (!voci.length) throw new Error('Non ho trovato nessuna voce di spesa nel foglio Spese.');
    var redditi = [];
    if (redditoRow >= 0) cols.forEach(function (x) {
      var ce = get(redditoRow, x.c);
      if (ce && typeof ce.v === 'number') { mesi[x.key].reddito = r2(ce.v); redditi.push(ce.v); }
    });
    var amexTetto = 500, atteso = null, invBase = 0, invRif = cols[0].key, stime = [null, null, null, null, null, null, null, null, null, null, null, null], eco = wb.Sheets['Economics'];
    if (eco) for (r = 0; r < 60; r++) {
      for (c = 0; c < 4; c++) {
        var t = eco[XLSX.utils.encode_cell({ r: r, c: c })];
        if (t && /netto mensile atteso/i.test(String(t.v))) {
          var val = eco[XLSX.utils.encode_cell({ r: r, c: c + 1 })];
          if (val && typeof val.v === 'number') atteso = r2(val.v);
        }
        var mm = t ? /^cedolino\s+([a-z]+)$/i.exec(String(t.v).trim()) : null;
        if (mm && MESI.indexOf(mm[1].toLowerCase()) >= 0) {
          var sv = eco[XLSX.utils.encode_cell({ r: r, c: c + 1 })];
          if (sv && typeof sv.v === 'number') stime[MESI.indexOf(mm[1].toLowerCase())] = r2(sv.v);
        }
        if (t && /^tetto amex/i.test(String(t.v))) {
          var tv = eco[XLSX.utils.encode_cell({ r: r, c: c + 1 })];
          if (tv && typeof tv.v === 'number') amexTetto = r2(tv.v);
        }
        if (t && /^investito in etf/i.test(String(t.v))) {
          var iv = eco[XLSX.utils.encode_cell({ r: r, c: c + 1 })];
          var ir = eco[XLSX.utils.encode_cell({ r: r, c: c + 2 })];
          if (iv && typeof iv.v === 'number') invBase = r2(iv.v);
          if (ir && typeof ir.v === 'number' && ir.v > 30000) { var dd = XLSX.SSF.parse_date_code(ir.v); invRif = keyOf(dd.y, dd.m); }
        }
      }
    }
    if (atteso === null) atteso = redditi.length ? r2(redditi.reduce(function (s, v) { return s + v; }, 0) / redditi.length) : 0;
    return { v: 1, settings: { redditoAtteso: atteso, inizio: cols[0].key, investitoBase: invBase, investitoRif: invRif, stimeCedolino: stime, amexTetto: amexTetto }, voci: voci, mesi: mesi };
  }

  var api = {
    keyOf: keyOf, parseKey: parseKey, addM: addM, nowKey: nowKey, r2: r2, label: label, shortLabel: shortLabel,
    MESI: MESI, emptyMese: emptyMese, getM: getM, hasVal: hasVal, amt: amt, calc: calc, slug: slug,
    valid: valid, parseWorkbook: parseWorkbook, investito: investito, stimaCedolino: stimaCedolino, amexDisponibile: amexDisponibile
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.FinCore = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function () {
  'use strict';
  var C = window.FinCore;
  var KEY = 'finanze-ale-v1';
  var TAB_KEY = 'finanze-ale-tab';
  var fmt = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
  var fmt0 = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, minimumFractionDigits: 0 });
  var grp = function (n) { return n.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  var eur = function (v) { v = C.r2(v); var p = Math.abs(v).toFixed(2).split('.'); return (v < 0 ? '-' : '') + grp(p[0]) + ',' + p[1] + '\u00a0€'; };
  var eur0 = function (v) { var r = Math.round(v); return (r < 0 ? '-' : '') + grp(String(Math.abs(r))) + '\u00a0€'; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var GRUPPI = { fisse: 'Spese fisse', carta: 'Carta di credito', investimento: 'Investimento' };
  var ICON = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    mese: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14.5l2 2 4-4"/></svg>',
    anno: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M10 20V6M15 20v-8M20 20V9"/></svg>',
    set: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>'
  };

  var db = null;
  var ui = { page: 0, month: C.nowKey(), prev: {}, showPaid: false, slide: null, celebrate: false, swap: false };
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { if (localStorage.getItem('finanze-ale-privacy') === '1') document.documentElement.classList.add('privacy'); } catch (e) { }

  function load() {
    try { var s = localStorage.getItem(KEY); if (s) { var d = JSON.parse(s); if (C.valid(d)) return d; } } catch (e) { }
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Non riesco a salvare su questo dispositivo'); }
  }
  function ensure(k) {
    if (!db.mesi[k]) db.mesi[k] = C.emptyMese();
    var m = db.mesi[k]; m.importi = m.importi || {}; m.pagati = m.pagati || {}; m.mov = m.mov || [];
    return m;
  }
  function voce(id) { for (var i = 0; i < db.voci.length; i++) if (db.voci[i].id === id) return db.voci[i]; return null; }
  function dayLabel(iso) { if (!iso) return ''; var d = String(iso).split('-'); return (+d[2]) + ' ' + C.MESI[+d[1] - 1].slice(0, 3); }
  /* Spese fisse (escluso l'investimento) tutte spuntate, ignorando quelle a 0 */
  function fisseSaldate(k) {
    var m = C.getM(db, k), n = 0;
    for (var i = 0; i < db.voci.length; i++) {
      var v = db.voci[i];
      if (v.gruppo === 'investimento' || C.amt(db, k, v) <= 0) continue;
      n++;
      if (!(m.pagati && m.pagati[v.id])) return false;
    }
    return n > 0;
  }
  function focusMonth() { var k = C.nowKey(); if (fisseSaldate(k)) k = C.addM(k, 1); return k < startKey() ? startKey() : k; }
  function startKey() { return (db && db.settings && db.settings.inizio) || '2026-10'; }
  function keys() { return Object.keys(db.mesi).sort(); }
  function lastKey() { var k = keys(); var cur = C.nowKey(); var l = k.length ? k[k.length - 1] : cur; return l > cur ? l : cur; }
  function parseNum(s) {
    s = String(s || '').replace(/[\s€]/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    return Number(s);
  }
  function numStr(v) { return v == null || v === '' ? '' : String(C.r2(v)).replace('.', ','); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  /* ---------------- rendering: tre pagine da scorrere (Mese · Andamento · Impostazioni) ---------------- */
  var $pages = document.getElementById('pages');
  var $pgMese = document.getElementById('pg-mese');
  var $pgAnno = document.getElementById('pg-anno');
  var $pgImp = document.getElementById('pg-imp');
  var $dots = document.getElementById('dots');
  var PAGES = [['mese', 'Mese'], ['anno', 'Andamento'], ['imp', 'Impostazioni']];

  function render() {
    if (!db) {
      document.body.classList.add('welcome-mode');
      $pgMese.innerHTML = '<main>' + viewWelcome() + '</main>';
      $pgAnno.innerHTML = ''; $pgImp.innerHTML = ''; $dots.hidden = true;
      return;
    }
    document.body.classList.remove('welcome-mode');
    $dots.hidden = false;
    $pgMese.innerHTML = '<header class="top">' + topMese() + '</header><main><div class="wrap' + (ui.slide ? ' slide-' + ui.slide : '') + '">' + viewMese() + '</div></main>';
    ui.slide = null;
    $pgAnno.innerHTML = '<header class="top">' + topPlain('Andamento', 'cosa ti aspetta') + '</header><main><div class="wrap">' + viewAnno() + '</div></main>';
    $pgImp.innerHTML = '<header class="top">' + topPlain('Impostazioni', 'voci, stime e backup') + '</header><main><div class="wrap">' + viewImp() + '</div></main>';
    renderDots();
    animateIn();
  }
  function renderDots() {
    $dots.innerHTML = PAGES.map(function (p, i) {
      return '<button class="dot-btn" data-act="page" data-i="' + i + '" aria-label="' + p[1] + '"' + (ui.page === i ? ' aria-current="page"' : '') + '><span></span></button>';
    }).join('');
  }
  function goPage(i, smooth) {
    ui.page = i;
    var w = $pages.clientWidth;
    $pages.scrollTo({ left: i * w, behavior: smooth && !REDUCED ? 'smooth' : 'auto' });
    renderDots();
  }
  var scrollT = null;
  $pages.addEventListener('scroll', function () {
    clearTimeout(scrollT);
    scrollT = setTimeout(function () {
      var i = Math.round($pages.scrollLeft / Math.max(1, $pages.clientWidth));
      if (i !== ui.page) { ui.page = i; renderDots(); }
    }, 80);
  }, { passive: true });
  window.addEventListener('resize', function () { goPage(ui.page || 0, false); });

  function topPlain(t, s) { return '<div class="wrap"><h1><small>' + esc(s) + '</small>' + esc(t) + '</h1></div>'; }
  function topMese() {
    var k = ui.month, cur = C.nowKey(), f = focusMonth();
    var dl = (function () { var d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate(); })();
    var tag = k === cur ? 'questo mese' + (dl > 0 ? ' · ' + dl + (dl === 1 ? ' giorno' : ' giorni') + ' alla fine' : ' · ultimo giorno') : (k < cur ? 'mese passato' : (k === C.addM(cur, 1) && fisseSaldate(cur) ? C.MESI[C.parseKey(cur).m - 1] + ' saldato' : 'in arrivo'));
    return '<div class="wrap mhead">' +
      '<button class="navbtn" data-act="prev" aria-label="Mese precedente"' + (k <= startKey() ? ' disabled' : '') + '>' + ICON.left + '</button>' +
      '<h1><span class="mtitle">' + esc(C.label(k)) + '</span>' +
      (k !== f ? '<button class="mtag link" data-act="oggi">' + esc(tag) + ' · vai a ' + esc(C.MESI[C.parseKey(f).m - 1]) + '</button>' : '<span class="mtag">' + esc(tag) + '</span>') + '</h1>' +
      '<button class="navbtn" data-act="next" aria-label="Mese successivo">' + ICON.right + '</button></div>';
  }
  function eurS(v) { v = C.r2(v); return Math.abs(v - Math.round(v)) < 0.005 ? eur0(v) : eur(v); }
  function daysIn(k) { var p = C.parseKey(k); return new Date(p.y, p.m, 0).getDate(); }
  function dueDay(v, k) { var g = parseInt(v.giorno, 10); if (!g || g < 1) return null; return Math.min(g, daysIn(k)); }
  function daysUntil(k, day) {
    var p = C.parseKey(k), t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((new Date(p.y, p.m - 1, day) - t) / 86400000);
  }
  function whenLabel(n) { return n === 0 ? 'oggi' : n === 1 ? 'domani' : 'tra ' + n + ' giorni'; }

  function viewMese() {
    var k = ui.month, c = C.calc(db, k), m = C.getM(db, k), cur = C.nowKey();
    var prevNome = C.MESI[C.parseKey(C.addM(k, -1)).m - 1], nomeK = C.MESI[C.parseKey(k).m - 1], nomeNx = C.MESI[C.parseKey(C.addM(k, 1)).m - 1];
    var ax = C.amexDisponibile(db, k);
    var sp = m.spostato || null, spAmt = sp ? (+sp.importo || 0) : 0, manca = sp ? C.r2(c.spostare - spAmt) : 0;
    var spDone = !!sp && Math.abs(manca) < 0.5;
    var h = '';

    // ---- carte: Trade Republic davanti finché non sposti, poi AMEX
    var trade = function (front) {
      if (!front) {
        return '<button class="card-back trade" data-act="spostato" aria-label="Trasferimento fatto. Tocca per annullare"><span class="cname">Trade Republic</span>' +
          '<span class="cmeta"><span class="okdot">' + ICON.check + '</span>' + eurS(spAmt) + ' spostati il ' + dayLabel(sp.data) + '</span></button>';
      }
      var lab = 'Da spostare';
      if (sp) lab += ' · spostati ' + eurS(spAmt) + ' il ' + dayLabel(sp.data) + ' · ' + (manca > 0 ? 'mancano ' + eurS(manca) : eurS(-manca) + ' in più');
      return '<div class="card-front trade' + (ui.swap ? ' swap-in' : '') + '"><div class="ctop"><span class="cname">Trade Republic</span>' +
        '<span class="num cside" data-count="var" data-val="' + c.varie + '" data-fmt="s"' + (c.varie < 0 ? ' style="color:var(--bad-on-dark)"' : '') + '>' + eurS(c.varie) + '</span></div>' +
        '<div class="cbottom"><div class="cmain"><span class="clab">' + esc(lab) + '</span>' +
        '<button class="t-copy" data-act="copy" data-v="' + c.spostare + '" aria-label="Copia l\'importo da spostare"><span class="cbig num" data-count="sp" data-val="' + c.spostare + '" data-fmt="f">' + eur(c.spostare) + '</span>' + ICON.copy + '</button></div>' +
        '<button class="t-check' + (sp ? ' partial' : '') + '" data-act="spostato" aria-label="' + (sp ? 'Aggiorna: segna l\'importo attuale come spostato' : 'Segna come spostato') + '">' + ICON.check + '</button></div></div>';
    };
    var amex = function (front) {
      if (!front) {
        return '<button class="card-back amex' + (ax.manuale ? ' manual' : '') + '" data-act="amex" aria-label="AMEX, spendibile ' + eurS(ax.val) + '. Tocca per modificare"><span class="cname">AMEX</span>' +
          '<span class="cmeta num" data-count="amex" data-val="' + ax.val + '" data-fmt="amex">+' + eurS(ax.val) + '</span></button>';
      }
      return '<div class="card-front amex' + (ui.swap ? ' swap-in' : '') + '"><div class="ctop"><span class="cname">AMEX</span></div>' +
        '<div class="cbottom"><div class="cmain"><span class="clab">Spendibile a ' + nomeK + ' · si paga a ' + nomeNx + '</span>' +
        '<button class="t-copy' + (ax.manuale ? ' manual' : '') + '" data-act="amex" aria-label="Modifica lo spendibile AMEX"><span class="cbig num" data-count="amex" data-val="' + ax.val + '" data-fmt="amex">+' + eurS(ax.val) + '</span></button></div></div></div>';
    };
    h += '<section class="stack" aria-label="Conti">' + (spDone ? trade(false) + amex(true) : amex(false) + trade(true)) + '</section>';
    ui.swap = false;

    // ---- cedolino + occhio
    var priv = document.documentElement.classList.contains('privacy');
    if (c.stima) h += '<div class="cedrow"><button class="ced" data-act="reddito">Cedolino di ' + prevNome + ' stimato · <u>inserisci</u></button></div>';
    var nx = C.addM(k, 1);
    if (k === cur && new Date().getDate() >= 20 && !C.hasVal(C.getM(db, nx).reddito)) {
      h += '<button class="nudge" data-act="redditonext"><span><b>Arrivato il cedolino di ' + nomeK + '?</b><small>Inseriscilo: decide quanto spostare a ' + nomeNx + '.</small></span>' + ICON.chev + '</button>';
    }

    // ---- Credit Agricole: vincolo e avanzamento delle spese fisse
    h += '<section class="ca' + (c.pctF >= 0.999 ? ' full' : '') + (ui.celebrate ? ' celebrate' : '') + '">' +
      '<div class="ca-head"><span class="ca-lab"><i class="ca-dot"></i>Credit Agricole · vincolo</span><span class="ca-right"><span class="num ca-val" data-count="vin" data-val="' + c.vincolo + '" data-fmt="s">' + eurS(c.vincolo) + '</span>' +
      '<button class="eye" data-act="privacy" aria-pressed="' + priv + '" aria-label="' + (priv ? 'Mostra gli importi' : 'Nascondi gli importi') + '">' + (priv ? ICON.eyeoff : ICON.eye) + '</button></span></div>' +
      '<div class="ca-bar"><span data-w="' + (c.pctF * 100).toFixed(1) + '" style="width:' + (ui.prev.bar !== undefined && !REDUCED ? ui.prev.bar : (REDUCED ? c.pctF * 100 : 0)).toFixed(1) + '%"></span></div>' +
      '<span class="ca-sub">' + (c.daPagareF > 0.005 ? 'pagato ' + eurS(c.pagF) + ' · mancano ' + eurS(c.daPagareF) + ' di spese fisse' : (c.fisse > 0 ? 'spese fisse di ' + nomeK + ' tutte pagate' : 'nessuna spesa fissa')) + '</span></section>';

    // ---- Scadenze: timeline per giorno di addebito
    var past = k < cur;
    var rows = db.voci.map(function (v, i) {
      var a = C.amt(db, k, v), paid = !!(m.pagati && m.pagati[v.id]), d = dueDay(v, k);
      return { v: v, a: a, paid: paid, d: d, i: i };
    });
    rows.sort(function (x, y) { return (x.d || 99) - (y.d || 99) || x.i - y.i; });
    var todo = rows.filter(function (r) { return !r.paid && r.a > 0; });
    var done = rows.filter(function (r) { return r.paid || r.a <= 0; });
    var nextId = null;
    if (k >= cur) for (var j = 0; j < todo.length; j++) { if (todo[j].d && daysUntil(k, todo[j].d) >= 0) { nextId = todo[j].v.id; break; } }
    var mon = nomeK.slice(0, 3);
    var rowHTML = function (r) {
      var v = r.v, cls = ['row', 'trow'], tag = '';
      var du = r.d ? daysUntil(k, r.d) : null;
      if (r.paid) cls.push('paid');
      else if (r.a <= 0) { cls.push('zero'); tag = '<span class="tag">nessuna spesa</span>'; }
      else if (past || (du !== null && du < 0 && k <= cur)) { cls.push('late'); tag = '<span class="tag">da spuntare</span>'; }
      else if (v.id === nextId) { cls.push('next'); tag = '<span class="tag">' + whenLabel(du) + '</span>'; }
      else if (v.stima) { cls.push('est'); tag = '<span class="tag">stima</span>'; }
      return '<li class="' + cls.join(' ') + '" data-row="' + esc(v.id) + '">' +
        '<span class="tday">' + (r.d ? '<b class="num">' + r.d + '</b><small>' + mon + '</small>' : '<b class="nod">–</b>') + '</span>' +
        '<span class="tname"><span class="name">' + esc(v.nome) + '</span>' + tag + '</span>' +
        '<button class="amt num" data-act="amt" data-id="' + esc(v.id) + '" aria-label="Modifica importo ' + esc(v.nome) + '">' + eur(r.a) + '</button>' +
        '<button class="check" data-act="toggle" data-id="' + esc(v.id) + '" aria-pressed="' + r.paid + '" aria-label="' + (r.paid ? 'Segna come non pagato: ' : 'Segna come pagato: ') + esc(v.nome) + '">' + ICON.check + '</button></li>';
    };
    h += '<section class="pays"><header><h2>Scadenze</h2><span class="count">' + c.nFPag + ' di ' + c.nF + ' pagate</span></header><ul class="list tline">';
    if (!todo.length) h += '<li class="alldone"><span class="alldone-dot">' + ICON.check + '</span>Tutto pagato per <span style="text-transform:capitalize">&nbsp;' + esc(nomeK) + '</span></li>';
    todo.forEach(function (r) { h += rowHTML(r); });
    h += '</ul>';
    if (done.length || spDone) {
      h += '<button class="fold" data-act="fold" aria-expanded="' + ui.showPaid + '"><span>Pagati e a zero · ' + (done.length + (spDone ? 1 : 0)) + '</span>' + ICON.down + '</button>';
      if (ui.showPaid) {
        h += '<ul class="list tline list-done">';
        if (spDone) h += '<li class="row trow paid" data-row="__spostato"><span class="tday"><b class="num">' + (+sp.data.split('-')[2]) + '</b><small>' + C.MESI[+sp.data.split('-')[1] - 1].slice(0, 3) + '</small></span>' +
          '<span class="tname"><span class="name">Spostati su Trade</span></span><span class="amt num">' + eur(spAmt) + '</span>' +
          '<button class="check" data-act="spostato" aria-pressed="true" aria-label="Trasferimento fatto. Tocca per annullare">' + ICON.check + '</button></li>';
        done.forEach(function (r) { h += rowHTML(r); });
        h += '</ul>';
      }
    }
    if (!db.voci.some(function (v) { return v.giorno; })) h += '<p class="note">Imposta il giorno di addebito di ogni voce in Impostazioni: qui le vedrai in ordine di scadenza.</p>';
    h += '</section>';
    return h;
  }

  function rangeKeys() {
    var ks = keys(), cur = C.nowKey();
    var start = db.settings.inizio || (ks[0] || cur);
    if (ks.length && ks[0] < start) start = ks[0];
    var end = lastKey(); var e2 = C.addM(cur, 2); if (e2 > end) end = e2;
    var out = [], k = start, guard = 0;
    while (k <= end && guard++ < 60) { out.push(k); k = C.addM(k, 1); }
    return out;
  }

  function viewAnno() {
    var ks = rangeKeys(), cur = C.nowKey(), h = '';
    var mm = function (k) { var p = C.parseKey(k); return cap(C.MESI[p.m - 1].slice(0, 3)) + ' ' + String(p.y).slice(2); };

    // ---- Patrimonio ETF
    var hist = (db.settings.portafoglio || []).slice().sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });
    var invNow = C.investito(db, cur, true), endK = ks[ks.length - 1];
    var invVoce = db.voci.filter(function (v) { return v.gruppo === 'investimento'; })[0];
    h += '<section class="card etf"><header><h2>Patrimonio ETF</h2>' + (hist.length ? '<span class="count">aggiornato il ' + dayLabel(hist[hist.length - 1].data) + '</span>' : '') + '</header>';
    if (hist.length) {
      var last = hist[hist.length - 1], invAt = investitoAt(last.data.slice(0, 7)), gain = C.r2(last.valore - invAt), pct = invAt > 0 ? gain / invAt * 100 : 0;
      h += '<div class="etf-val"><span class="num big">' + eurS(last.valore) + '</span>' +
        '<span class="etf-gain ' + (gain >= 0 ? 'up' : 'down') + '">' + (gain >= 0 ? '+' : '−') + eurS(Math.abs(gain)) + ' · ' + (gain >= 0 ? '+' : '−') + Math.abs(pct).toFixed(1).replace('.', ',') + '% <span>su ' + eurS(invAt) + ' investiti</span></span></div>';
      if (hist.length >= 2) h += etfChart(hist);
      else h += '<p class="note">Aggiorna il valore ogni tanto: dal secondo inserimento compare il grafico.</p>';
    } else {
      h += '<p class="sub">Scrivi qui il valore del portafoglio che vedi su Trade Republic: l\'app calcola guadagno o perdita rispetto a quanto hai investito.</p>';
    }
    h += '<button class="btn btn-block" data-act="etfval">' + ICON.plus + 'Aggiorna il valore di oggi</button>' +
      '<div class="stats2">' + stat('Investito', invNow) + '<div class="stat"><span class="eyebrow">Piano mensile</span><span class="num">' + (invVoce ? eur0(C.amt(db, cur, invVoce)) : '–') + '</span></div></div></section>';

    // ---- Media mensile
    var sumF = 0;
    ks.forEach(function (k) { sumF += C.calc(db, k).fisse; });
    var nk = Math.max(ks.length, 1);
    h += '<section class="card"><header><h2>Spese fisse</h2><span class="count">media ' + mm(ks[0]) + ' → ' + mm(ks[ks.length - 1]) + '</span></header>' +
      '<div class="stat"><span class="num big2">' + eur0(sumF / nk) + '</span><small>al mese</small></div></section>';

    // ---- Mesi pesanti
    var avg = sumF / nk;
    var heavy = ks.filter(function (k) { return k > cur; }).map(function (k) { return { k: k, c: C.calc(db, k) }; })
      .filter(function (x) { return x.c.fisse > avg * 1.08; }).sort(function (a, b) { return b.c.fisse - a.c.fisse; }).slice(0, 3)
      .sort(function (a, b) { return a.k < b.k ? -1 : 1; });
    if (heavy.length) {
      h += '<section class="card"><header><h2>Mesi pesanti</h2><span class="count">spese fisse sopra la media</span></header><div class="tbl">';
      heavy.forEach(function (x) {
        var top = db.voci.filter(function (v) { return v.gruppo !== 'investimento'; })
          .map(function (v) { return { v: v, extra: C.amt(db, x.k, v) - (+v.importo || 0) }; })
          .sort(function (a, b) { return b.extra - a.extra; })[0];
        h += '<button class="tr tr2" data-act="gomonth" data-k="' + x.k + '"><span class="tm">' + mm(x.k) + '</span>' +
          '<span class="why">' + (top && top.extra > 1 ? esc(top.v.nome) : '') + '</span>' +
          '<span class="num">' + eur0(x.c.fisse) + '</span></button>';
      });
      h += '</div></section>';
    }

    return h;
  }

  /* Investito a un certo mese: dopo il riferimento somma le spunte, prima toglie il piano mensile */
  function investitoAt(k) {
    var st = db.settings || {}, rif = st.investitoRif || C.nowKey();
    if (k >= rif) return C.investito(db, k, true);
    var tot = +st.investitoBase || 0, x = C.addM(k, 1), g = 0;
    var iv = db.voci.filter(function (v) { return v.gruppo === 'investimento'; });
    while (x <= rif && g++ < 240) { iv.forEach(function (v) { tot -= C.amt(db, x, v); }); x = C.addM(x, 1); }
    return Math.max(0, C.r2(tot));
  }

  /* Grafico valore del portafoglio vs capitale investito, in scala */
  function etfChart(hist) {
    var pts = hist.map(function (p) { return { d: p.data, v: +p.valore, inv: investitoAt(p.data.slice(0, 7)) }; });
    var W = 340, H = 170, L = 6, R = 50, T = 12, B = 26;
    var all = []; pts.forEach(function (p) { all.push(p.v, p.inv); });
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var span = Math.max(hi - lo, 100), step = Math.pow(10, Math.floor(Math.log10(span / 2)));
    [1, 2, 2.5, 5, 10].some(function (f) { if (span / (step * f) <= 4) { step = step * f; return true; } return false; });
    var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step; if (y1 === y0) y1 = y0 + step;
    var x = function (i) { return L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - y0) / (y1 - y0)); };
    var s = '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Valore del portafoglio e capitale investito nel tempo">';
    for (var g = y0; g <= y1 + 0.001; g += step) {
      s += '<line x1="' + L + '" x2="' + (W - R + 8) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" class="grid"/>' +
        '<text x="' + W + '" y="' + (y(g) + 3.5).toFixed(1) + '" text-anchor="end">' + eur0(g) + '</text>';
    }
    var inv = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.inv).toFixed(1); }).join(' ');
    var val = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    s += '<path d="' + val + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z" class="area"/>';
    s += '<path d="' + inv + '" class="inv"/><path d="' + val + '" class="val"/>';
    var li = pts.length - 1;
    s += '<circle cx="' + x(li).toFixed(1) + '" cy="' + y(pts[li].v).toFixed(1) + '" r="5" class="end"/>';
    var lab = function (i) { return dayLabel(pts[i].d); };
    s += '<text x="' + x(0).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="start">' + lab(0) + '</text>' +
      '<text x="' + x(li).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="end" class="strong">' + lab(li) + '</text>';
    s += '</svg><div class="keys"><span><i class="k-val"></i>Valore</span><span><i class="k-inv"></i>Investito</span></div></div>';
    return s;
  }

  function sheetEtf() {
    var hist = (db.settings.portafoglio || []).slice().sort(function (a, b) { return a.data < b.data ? -1 : 1; });
    var last = hist[hist.length - 1];
    openSheet('<h3>Valore del portafoglio</h3><p class="note">Scrivi il totale che vedi oggi su Trade Republic. Se lo aggiorni più volte nello stesso giorno, vale l\'ultimo.</p>' +
      '<div class="field"><label for="s-etf">Valore di oggi</label><input class="input input-big" id="s-etf" inputmode="decimal" value="" placeholder="' + (last ? numStr(last.valore) : '0') + '" autocomplete="off"></div>' +
      ERR + ACTIONS('Salva', last ? '<button type="button" class="btn btn-block btn-danger" data-act="etfdel">Elimina l\'ultimo valore (' + dayLabel(last.data) + ')</button>' : ''),
      function () {
        var n = parseNum(document.getElementById('s-etf').value);
        if (!isFinite(n) || n < 0) return showErr('Scrivi il valore, per esempio 1486,20.');
        var arr = db.settings.portafoglio = (db.settings.portafoglio || []).filter(function (p) { return p.data !== todayISO(); });
        arr.push({ data: todayISO(), valore: C.r2(n) });
        save(); closeSheet(); render(); toast('Valore del portafoglio aggiornato');
      }, 's-etf');
  }

  function stat(l, v, s) { return '<div class="stat"><span class="eyebrow">' + esc(l) + '</span><span class="num">' + eur0(v) + '</span>' + (s ? '<small>' + esc(s) + '</small>' : '') + '</div>'; }

  function viewImp() {
    var s = db.settings, h = '';
    var st = s.stimeCedolino || [];
    var ced = keys().filter(function (k) { return C.hasVal(C.getM(db, k).reddito); }).reverse();
    h += '<section class="card"><header><h2>Cedolini inseriti</h2></header>';
    if (!ced.length) h += '<p class="note">Nessun cedolino inserito. Lo inserisci dalla home quando arriva: da lì in poi lo modifichi solo qui.</p>';
    else {
      h += '<ul class="list">';
      ced.forEach(function (k) {
        var pk = C.addM(k, -1);
        h += '<li><button class="setrow" data-act="editced" data-k="' + k + '"><span class="row-main"><span class="name" style="text-transform:capitalize">' + esc(C.label(pk)) + '</span><span class="meta"><span>finanzia ' + esc(C.label(k)) + '</span></span></span><span class="num">' + eur(C.getM(db, k).reddito) + '</span>' + ICON.chev + '</button></li>';
      });
      h += '</ul>';
    }
    h += '</section>';
    h += '<section class="card"><header><h2>Stima cedolini</h2></header>' +
      '<p class="note">Usate finché non inserisci il cedolino vero. Il cedolino di un mese finanzia il mese dopo: quello di dicembre vale per le spese di gennaio.</p>' +
      '<div class="months">' + C.MESI.map(function (n, i) {
        return '<div class="field"><label for="f-st-' + i + '">' + n.slice(0, 3) + '</label><input class="input num" id="f-st-' + i + '" inputmode="decimal" value="' + numStr(st[i]) + '" placeholder="' + numStr(s.redditoAtteso) + '" data-change="stima" data-i="' + i + '"></div>';
      }).join('') + '</div>' +
      '<p class="note">Il vincolo è sempre arrotondato per eccesso a 10 €.</p></section>';
    h += '<section class="card"><header><h2>ETF</h2></header>' +
      '<div class="field"><label for="f-inv">Già investito (fino a ' + esc(C.label(s.investitoRif || C.nowKey())) + ' incluso)</label><input class="input num" id="f-inv" inputmode="decimal" value="' + numStr(s.investitoBase || 0) + '" data-change="invbase"></div>' +
      '<p class="note">Da qui in poi l\'app aggiunge ogni investimento che spunti. Se aggiorni il totale, vale fino al mese corrente incluso.</p></section>';

    h += '<section class="card"><header><h2>Voci di spesa</h2><button class="btn btn-small btn-primary" data-act="newvoce">Nuova</button></header><ul class="list">';

      ERR + ACTIONS(v ? 'Salva' : 'Aggiungi', v ? '<button type="button" class="btn btn-block btn-danger" data-act="delvoce" data-id="' + esc(v.id) + '">Elimina voce</button>' : ''),
      function () {
        var nome = document.getElementById('v-nome').value.trim();

        var gv = document.getElementById('v-giorno').value.trim(), gg = gv === '' ? null : parseInt(gv, 10);
        if (gv !== '' && (!(gg >= 1 && gg <= 31))) return showErr('Il giorno di addebito va da 1 a 31, oppure lascialo vuoto.');

        }

  function shareFile() {

    var file;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }

  function decodeBackup(txt) {
    txt = String(txt || '').trim();
    var d;
    if (txt.charAt(0) === '{') d = JSON.parse(txt);
    else d = JSON.parse(decodeURIComponent(escape(atob(txt.replace(/\s/g, '')))));
    if (!C.valid(d)) throw new Error('Il codice non contiene un backup di Finanze.');
    return d;
  }
  function replaceData(d, msg) {
    var go = function () { db = d; save(); ui.month = focusMonth(); closeSheet(); render(); goPage(0, false); toast(msg); };
    if (db) sheetConfirm('Sostituire i dati attuali?', 'I dati presenti su questo dispositivo verranno sostituiti con quelli importati.', 'Sostituisci', go);
    else go();
  }

    openSheet('<h3>Incolla codice di backup</h3><div class="field"><label for="s-paste">Codice</label><textarea class="input" id="s-paste" placeholder="Incolla qui il codice"></textarea></div>' + ERR + ACTIONS('Importa'),
      function () {
        try { var d = decodeBackup(document.getElementById('s-paste').value); } catch (e) { return showErr('Codice non valido. Copialo di nuovo per intero.'); }
        closeSheet(); setTimeout(function () { replaceData(d, 'Backup importato'); }, 280);
      }, 's-paste');
  }

  var xlsxLoading = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (xlsxLoading) return xlsxLoading;
    xlsxLoading = new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = window.FIN_XLSX_SRC;
      s.onload = function () { window.XLSX ? res(window.XLSX) : rej(new Error('x')); };
      s.onerror = function () { xlsxLoading = null; rej(new Error('Non riesco a caricare il lettore Excel. Controlla la connessione e riprova.')); };
      document.head.appendChild(s);
    });
    return xlsxLoading;
  }
  function importFile(file) {
    if (!file) return;
    var isJson = /\.json$/i.test(file.name) || file.type === 'application/json';
    var r = new FileReader();
    r.onerror = function () { toast('Non riesco a leggere il file'); };
    if (isJson) {
      r.onload = function () { try { replaceData(decodeBackup(r.result), 'Backup importato'); } catch (e) { toast('Il file non è un backup di Finanze'); } };
      r.readAsText(file);
    } else {
      toast('Leggo il file…');
      r.onload = function () {
        loadXLSX().then(function (X) {
          var wb = X.read(new Uint8Array(r.result), { type: 'array' });
          var d = C.parseWorkbook(X, wb);
          replaceData(d, 'Importate ' + d.voci.length + ' voci e ' + Object.keys(d.mesi).length + ' mesi');
        }).catch(function (e) { toast(e && e.message ? e.message : 'Il file Excel non è nel formato atteso'); });
      };
      r.readAsArrayBuffer(file);
    }
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) {
      var li = e.target.closest('li.row[data-row]');
      if (li) t = li.querySelector('.check');
    }
    if (!t) return;
    var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    switch (a) {
      case 'page': goPage(+t.getAttribute('data-i'), true); break;
      case 'etfval': sheetEtf(); break;
      case 'etfdel': {
        var hs = (db.settings.portafoglio || []).slice().sort(function (x, y) { return x.data < y.data ? -1 : 1; });
        hs.pop(); db.settings.portafoglio = hs; save(); closeSheet(); render(); toast('Ultimo valore eliminato'); break;
      }
      case 'prev': goMonth(-1); break;
      case 'next': goMonth(1); break;
      case 'oggi': ui.month = focusMonth(); render(); break;
      case 'gomonth': ui.month = t.getAttribute('data-k'); render(); $pgMese.scrollTop = 0; goPage(0, true); break;
      case 'toggle': {
        var tk = ui.month, m = ensure(tk), was = fisseSaldate(tk), nowPaid = !m.pagati[id], vv = voce(id);
        var apply = function () {
          if (nowPaid) m.pagati[id] = true; else delete m.pagati[id];
          save();
          if (!was && fisseSaldate(tk)) ui.celebrate = true;
          render();
          if (ui.celebrate) {
            setTimeout(function () { ui.celebrate = false; }, 50);
            toast(cap(C.MESI[C.parseKey(tk).m - 1]) + ' saldato · alla prossima apertura vedi ' + C.MESI[C.parseKey(C.addM(tk, 1)).m - 1]);
          } else {
            toast((vv ? vv.nome : 'Voce') + (nowPaid ? ' pagato' : ' da pagare'), { label: 'Annulla', fn: function () { if (nowPaid) delete m.pagati[id]; else m.pagati[id] = true; save(); render(); } });
          }
        };
        var li = t.closest('li');
        if (li && !REDUCED) { li.classList.add(nowPaid ? 'going' : 'coming'); setTimeout(apply, 260); } else apply();
        break;
      }
      case 'fold': ui.showPaid = !ui.showPaid; render(); break;
      case 'privacy': {
        var on = document.documentElement.classList.toggle('privacy');
        try { localStorage.setItem('finanze-ale-privacy', on ? '1' : '0'); } catch (er) { }
        render(); toast(on ? 'Importi nascosti' : 'Importi visibili'); break;
      }
      case 'copy': {
        var txt = C.r2(+t.getAttribute('data-v')).toFixed(2).replace('.', ',');
        var ok = function () { toast('Copiato ' + txt + ' · incollalo nel bonifico'); };
        var fb = function () { var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); try { document.execCommand('copy'); ok(); } catch (er) { toast('Non riesco a copiare'); } ta.remove(); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
        break;
      }
      case 'amt': sheetAmt(id); break;
      case 'reddito': sheetReddito(); break;
      case 'amex': sheetAmex(); break;
      case 'amexauto': delete ensure(ui.month).amexLimite; save(); closeSheet(); render(); toast('Torno al calcolo automatico'); break;
      case 'spostato': {
        var ms = ensure(ui.month), cs = C.calc(db, ui.month), prevSp = ms.spostato ? JSON.parse(JSON.stringify(ms.spostato)) : null;
        var already = ms.spostato && Math.abs(C.r2(cs.spostare - (+ms.spostato.importo || 0))) < 0.5;
        var restore = function () { if (prevSp) ms.spostato = prevSp; else delete ms.spostato; save(); render(); };
        if (already) { delete ms.spostato; ui.swap = true; save(); render(); toast('Trasferimento di nuovo da fare', { label: 'Annulla', fn: restore }); }
        else {
          ms.spostato = { data: todayISO(), importo: cs.spostare };
          var front = $pgMese.querySelector('.card-front.trade');
          var fin = function () { ui.swap = true; save(); render(); toast('Spostati ' + eurS(cs.spostare) + ' · ora davanti c\'è AMEX', { label: 'Annulla', fn: restore }); };
          if (front && !REDUCED) { front.classList.add('swap-out'); setTimeout(fin, 300); } else fin();
        }
        break;
      }
      case 'redditonext': ui.month = C.addM(ui.month, 1); render(); window.scrollTo(0, 0); sheetReddito(); break;
      case 'editced': sheetReddito(t.getAttribute('data-k')); break;
      case 'clearred': ensure(t.getAttribute('data-k') || ui.month).reddito = null; save(); closeSheet(); render(); toast('Torno alla stima'); break;
      case 'newvoce': sheetVoce(null); break;
      case 'editvoce': sheetVoce(id); break;
      case 'delvoce': closeSheet(); setTimeout(function () {
        var v = voce(id);
        sheetConfirm('Eliminare «' + v.nome + '»?', 'La voce sparisce da tutti i mesi, insieme ai suoi importi e alle spunte.', 'Elimina', function () {
          db.voci = db.voci.filter(function (x) { return x.id !== id; });
          Object.keys(db.mesi).forEach(function (k) { delete db.mesi[k].importi[id]; delete db.mesi[k].pagati[id]; });
          save(); render(); toast('Voce eliminata');
        });
      }, 280); break;
      case 'export': sheetExport(); break;
      case 'sharefile': shareFile(); break;
      case 'copycode': copyCode(); break;
      case 'paste': sheetPaste(); break;
      case 'blank': db = blankDb(); save(); render(); toast('Modello creato: completa le voci in Impostazioni'); break;
      case 'wipe': sheetConfirm('Cancellare tutti i dati?', 'Voci, importi, cedolini e spunte verranno eliminati da questo dispositivo. Esporta prima un backup se ti serve.', 'Cancella tutto', function () {
        db = null; try { localStorage.removeItem(KEY); } catch (er) { } render();
      }); break;
      case 'close': closeSheet(); break;
    }
  });
  $scrim.addEventListener('click', closeSheet);
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'sheet-form') return;
    e.preventDefault();
    if (sheetSubmit) sheetSubmit();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$sheet.hidden) closeSheet(); });
  document.addEventListener('change', function (e) {
    var t = e.target, w = t.getAttribute('data-change');
    if (!w) return;
    if (w === 'file') { importFile(t.files && t.files[0]); t.value = ''; }
    else if (w === 'atteso') { var n = parseNum(t.value); if (isFinite(n) && n >= 0) { db.settings.redditoAtteso = C.r2(n); save(); toast('Stima aggiornata'); } else { toast('Importo non valido'); t.value = numStr(db.settings.redditoAtteso); } }
    else if (w === 'stima') {
      var si = +t.getAttribute('data-i'), sn = t.value.trim() === '' ? null : parseNum(t.value);
      if (sn === null || (isFinite(sn) && sn >= 0)) {
        if (!Array.isArray(db.settings.stimeCedolino)) db.settings.stimeCedolino = [null, null, null, null, null, null, null, null, null, null, null, null];
        db.settings.stimeCedolino[si] = sn === null ? null : C.r2(sn); save(); toast('Stima di ' + C.MESI[si] + ' aggiornata');
      } else { toast('Importo non valido'); t.value = numStr((db.settings.stimeCedolino || [])[si]); }
    }
    else if (w === 'invbase') { var iv = parseNum(t.value); if (isFinite(iv) && iv >= 0) { db.settings.investitoBase = C.r2(iv); db.settings.investitoRif = C.nowKey(); save(); render(); toast('Totale investito aggiornato'); } else { toast('Importo non valido'); t.value = numStr(db.settings.investitoBase || 0); } }
    else if (w === 'arrot') { db.settings.arrot = +t.value; save(); toast('Arrotondamento aggiornato'); }
  });

  var toastT = null;
  function toast(msg, action) {
    var el = document.getElementById('toast');
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button" class="toast-btn">' + esc(action.label) + '</button>' : '');
    el.classList.toggle('has-action', !!action);
    if (action) el.querySelector('.toast-btn').onclick = function () { el.classList.remove('on'); action.fn(); };
    el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, action ? 4000 : 2400);
  }
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }

  /* Cambio mese con scorrimento */
  function goMonth(dir) {
    if (dir < 0 && ui.month <= startKey()) return;
    ui.month = C.addM(ui.month, dir); ui.slide = dir > 0 ? 'l' : 'r'; render();
  }
  /* Animazioni: anello che si riempie e cifre che scorrono */
  function fmtCount(f, v, target) {
    if (f === 'pct') return Math.round(v) + '%';
    if (f === 'f') return eur(v);
    var whole = Math.abs(target - Math.round(target)) < 0.005;
    var str = whole ? eur0(v) : eur(v);
    return f === 'amex' ? '+' + str : str;
  }
  function animateIn() {
    var bar = $pgMese.querySelector('.ca-bar span');
    if (bar) {
      var w = +bar.getAttribute('data-w');
      requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = w + '%'; }); });
      ui.prev.bar = w;
    }
    var els = document.querySelectorAll('[data-count]');
    Array.prototype.forEach.call(els, function (el) {
      var key = el.getAttribute('data-count'), to = +el.getAttribute('data-val'), f = el.getAttribute('data-fmt');
      var from = ui.prev[key] !== undefined ? ui.prev[key] : 0;
      ui.prev[key] = to;
      if (REDUCED || Math.abs(from - to) < 0.005) { el.textContent = fmtCount(f, to, to); return; }
      var t0 = null, dur = 550;
      var step = function (ts) {
        if (t0 === null) t0 = ts;
        var q = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - q, 3);
        el.textContent = fmtCount(f, from + (to - from) * e, to);
        if (q < 1) requestAnimationFrame(step);
      };
      el.textContent = fmtCount(f, from, to);
      requestAnimationFrame(step);
    });
  }

  // when the app comes back to the foreground on a new month, jump to it
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
    if (db && hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000 && $sheet.hidden) { ui.month = focusMonth(); render(); }
  });

  db = load();
  if (db && db.settings && db.settings.investitoBase === undefined && window.FIN_SEED && window.FIN_SEED.settings) { db.settings.investitoBase = window.FIN_SEED.settings.investitoBase || 0; db.settings.investitoRif = window.FIN_SEED.settings.investitoRif; save(); }
  if (!db && window.FIN_SEED && C.valid(window.FIN_SEED)) { db = JSON.parse(JSON.stringify(window.FIN_SEED)); save(); }
  if (db && db.settings && !Array.isArray(db.settings.stimeCedolino) && window.FIN_SEED && window.FIN_SEED.settings && window.FIN_SEED.settings.stimeCedolino) { db.settings.stimeCedolino = window.FIN_SEED.settings.stimeCedolino.slice(); save(); }
  if (db) {
    var ren = false;
    db.voci.forEach(function (v) { if (/^pagamenti amex \(t-1\)$/i.test(v.nome)) { v.nome = 'AMEX (T-1)'; ren = true; } });
    if (ren) save();
    ui.month = focusMonth();
  }
  render();
  goPage(0, false);

  if (window.FIN_PWA) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  }
})();

</script>
</body>
</html>
